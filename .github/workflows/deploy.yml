name: Toady CI/CD Pipeline

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# Keep deployments serial; never interrupt a deployment halfway through.
concurrency:
  group: toady-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository files
        run: |
          python3 scripts/check-repository.py
          python3 -m unittest discover -s scripts/tests -v
      # 배포 이미지와 같은 nginx로 설정 문법을 미리 검사한다. 설정 오류는 배포 후 웹 컨테이너 재시작 반복으로만 드러나기 때문이다.
      - name: Check nginx config
        run: docker run --rm -v "$PWD/toadyReactWeb/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: toadyReactWeb/package-lock.json
      - name: Test API
        working-directory: toadyWebApi
        run: bash ./gradlew --no-daemon test
      - name: Test scheduler (external integration tests stay opt-in)
        working-directory: toadyScheduler
        run: bash ./gradlew --no-daemon test
      - name: Build frontend
        working-directory: toadyReactWeb
        run: |
          npm ci
          npm test
          npm run build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            toadyWebApi/build/reports/tests/
            toadyScheduler/build/reports/tests/

  verify-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4.9
        env:
          MARIADB_ROOT_PASSWORD: ci-test-password
          MARIADB_DATABASE: toady_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare isolated schema fixture
        env:
          DB_CONTAINER: ${{ job.services.mariadb.id }}
        run: >-
          docker exec "$DB_CONTAINER" mariadb -uroot -pci-test-password toady_test
          -e 'CREATE TABLE TB_URBTY_OFCTL_LTTOT_PBLANC_MDL (ID BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY, HOUSE_MANAGE_NO VARCHAR(40), PBLANC_NO VARCHAR(40), MODEL_NO VARCHAR(4), TP VARCHAR(10), SUPLY_AMOUNT VARCHAR(20)) ENGINE=InnoDB'
      - name: Verify MariaDB SQL and transactions on temporary tables
        working-directory: toadyWebApi
        env:
          TOADY_TEST_DB_URL: jdbc:mariadb://127.0.0.1:3306/toady_test
          TOADY_TEST_DB_USERNAME: root
          TOADY_TEST_DB_PASSWORD: ci-test-password
        run: bash ./gradlew --no-daemon mariadbTest -Dtoady.mariadb.temporary.enabled=true
      - name: Upload MariaDB test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-test-reports
          path: toadyWebApi/build/reports/tests/mariadbTest/

  build-and-deploy:
    needs: [verify, verify-mariadb]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push commit-tagged images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
        run: |
          set -eu
          : "${VITE_KAKAO_MAP_KEY:?Set the VITE_KAKAO_MAP_KEY GitHub Actions secret before deploying}"
          docker build --build-arg VITE_KAKAO_MAP_KEY -t "$DOCKER_USERNAME/toady-react-web:$IMAGE_TAG" ./toadyReactWeb
          docker build -t "$DOCKER_USERNAME/toady-web-api:$IMAGE_TAG" ./toadyWebApi
          docker build -t "$DOCKER_USERNAME/toady-scheduler:$IMAGE_TAG" ./toadyScheduler
          docker push "$DOCKER_USERNAME/toady-react-web:$IMAGE_TAG"
          docker push "$DOCKER_USERNAME/toady-web-api:$IMAGE_TAG"
          docker push "$DOCKER_USERNAME/toady-scheduler:$IMAGE_TAG"
      - name: Copy deployment files to EC2
        # 서버 SSH 키를 받는 서드파티 Action은 태그가 옮겨져도 바뀌지 않도록 커밋 SHA로 고정한다(v0.1.7).
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml,scripts/check-deployment.sh
          # 바로 덮어쓰지 않고 받아 두었다가, 배포 스크립트가 이전 파일을 보관한 뒤 교체한다(롤백 때 함께 되돌린다).
          target: ~/toady/.incoming/
      - name: Deploy and verify
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME,IMAGE_TAG
          script: |
            set -eu
            cd ~/toady
            export DOCKER_USERNAME IMAGE_TAG
            NEW_TAG="$IMAGE_TAG"
            APPS="toadyWebApi toadyScheduler toadyReactWeb"
            # 마지막으로 검증에 성공한 태그. 새 이미지가 확인을 통과하지 못하면 이 태그로 되돌린다.
            PREVIOUS_TAG=""
            if [ -f .deployed-image-tag ]; then PREVIOUS_TAG=$(tr -d '[:space:]' < .deployed-image-tag); fi
            # 새 compose·확인 스크립트를 설치하기 전에 지금 파일을 보관한다. 배포가 실패하면 이미지 태그와 함께 되돌린다.
            mkdir -p .rollback/scripts
            [ ! -f docker-compose.yml ] || cp -p docker-compose.yml .rollback/docker-compose.yml
            [ ! -f scripts/check-deployment.sh ] || cp -p scripts/check-deployment.sh .rollback/scripts/check-deployment.sh
            restore_config() {
              [ ! -f .rollback/docker-compose.yml ] || cp -p .rollback/docker-compose.yml docker-compose.yml
              [ ! -f .rollback/scripts/check-deployment.sh ] || cp -p .rollback/scripts/check-deployment.sh scripts/check-deployment.sh
            }
            mkdir -p scripts
            cp .incoming/docker-compose.yml docker-compose.yml
            cp .incoming/scripts/check-deployment.sh scripts/check-deployment.sh
            # 앱 컨테이너만 바꾼다. --no-deps로 compose 설정이 바뀌어도 mariadb·nginx를 다시 만들지 않는다.
            start_apps() {
              # 앞단 nginx는 업스트림 IP를 기억한다. 앱 컨테이너를 다시 만든 뒤 설정을 다시 읽혀 502를 막는다.
              docker-compose -p toady up -d --no-deps $APPS && { docker exec nginx nginx -s reload || true; }
            }
            # set -e는 if 조건 안에서 꺼지므로 pull·up·확인 중 어느 단계가 실패해도 같은 롤백 경로로 들어온다.
            deploy_failed=""
            if ! docker-compose -p toady config -q; then
              # 새 설정 자체가 잘못됐으면 컨테이너를 건드리지 않고 이전 설정으로 되돌린 뒤 끝낸다.
              restore_config
              echo "DEPLOY FAILED: $NEW_TAG (docker-compose.yml is invalid). Previous configuration restored; containers unchanged." >&2
              exit 1
            elif ! docker-compose -p toady pull $APPS; then
              deploy_failed="image pull failed"
            elif ! start_apps; then
              deploy_failed="docker-compose up failed"
            elif ! bash scripts/check-deployment.sh; then
              deploy_failed="deployment checks failed"
            fi
            if [ -n "$deploy_failed" ]; then
              if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$NEW_TAG" ]; then
                echo "DEPLOY FAILED: $NEW_TAG ($deploy_failed). Rolling back app containers and compose files to $PREVIOUS_TAG." >&2
                restore_config
                export IMAGE_TAG="$PREVIOUS_TAG"
                if ! start_apps; then
                  echo "ROLLBACK FAILED: docker-compose up for $PREVIOUS_TAG failed. Inspect the server manually." >&2
                elif bash scripts/check-deployment.sh; then
                  echo "ROLLBACK OK: app containers are running $PREVIOUS_TAG. DB changes are not rolled back." >&2
                else
                  echo "ROLLBACK CHECK FAILED: $PREVIOUS_TAG also failed checks. Inspect the server manually." >&2
                fi
              else
                restore_config
                echo "DEPLOY FAILED: $NEW_TAG ($deploy_failed) and no previous successful tag is recorded. Compose files restored; containers not rolled back." >&2
              fi
              exit 1
            fi
            # 성공 기록: 태그 파일과 .env의 IMAGE_TAG를 같은 태그로 맞춘다.
            # 서버에서 직접 docker-compose를 실행해도(예: certbot 갱신, 재시작) 배포한 태그를 쓰도록 .env의 IMAGE_TAG 줄만 바꾼다.
            # 같은 폴더의 임시 파일에 쓰고 mv로 교체해 중간 상태가 남지 않게 하고, 기존 .env 권한을 유지한다.
            umask 077
            tag_tmp=$(mktemp .deployed-image-tag.XXXXXX)
            env_tmp=$(mktemp .env.XXXXXX)
            trap 'rm -f "$tag_tmp" "$env_tmp"' EXIT
            # cp -p로 기존 권한을 먼저 옮긴 뒤 내용을 덮어쓴다(리다이렉션은 권한을 바꾸지 않는다).
            [ ! -f .deployed-image-tag ] || cp -p .deployed-image-tag "$tag_tmp"
            printf '%s\n' "$NEW_TAG" > "$tag_tmp"
            if [ -f .env ]; then
              cp -p .env "$env_tmp"
              { grep -v '^IMAGE_TAG=' .env || true; } > "$env_tmp"
            fi
            printf 'IMAGE_TAG=%s\n' "$NEW_TAG" >> "$env_tmp"
            mv -f "$env_tmp" .env
            mv -f "$tag_tmp" .deployed-image-tag
            echo "DEPLOY OK: $NEW_TAG recorded in .deployed-image-tag and .env"
