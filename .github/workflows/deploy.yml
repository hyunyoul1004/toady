name: Toady CI/CD Pipeline

on:
  pull_request:
  push:
    branches: [master]
  # 같은 커밋을 다시 배포하거나 VITE_KAKAO_MAP_KEY·기반 이미지 갱신을 반영할 때 Actions 화면에서 실행한다(이미지 4개를 모두 새로 빌드).
  workflow_dispatch:

permissions:
  contents: read

# Keep deployments serial; never interrupt a deployment halfway through.
concurrency:
  group: toady-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # API의 요청 제한·공유 캐시를 실제 Redis에서 검사한다(RedisIntegrationTest). 운영 compose와 같은 이미지.
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check repository files
        run: |
          python3 scripts/check-repository.py
          python3 -m unittest discover -s scripts/tests -v
      # 배포 이미지와 같은 nginx로 설정 문법을 미리 검사한다. 설정 오류는 배포 후 웹 컨테이너 재시작 반복으로만 드러나기 때문이다.
      - name: Check nginx config
        run: docker run --rm -v "$PWD/toadyReactWeb/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.30-alpine nginx -t
      # 앞단 nginx 설정(nginx/toady.conf)도 같은 이미지로 검사한다. 인증서 파일이 있어야 문법 검사가 끝나므로 임시 자체 서명 인증서를 둔다.
      - name: Check front nginx config
        run: |
          ssl="$RUNNER_TEMP/ssl/live/toady.co.kr-0002"
          mkdir -p "$ssl"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=ci.toady.test" -keyout "$ssl/privkey.pem" -out "$ssl/fullchain.pem" 2>/dev/null
          docker run --rm -v "$PWD/nginx/toady.conf:/etc/nginx/conf.d/default.conf:ro" -v "$PWD/nginx/admin-allow.inc.example:/etc/nginx/conf.d/admin-allow.inc:ro" -v "$RUNNER_TEMP/ssl:/etc/nginx/ssl:ro" nginx:1.30-alpine nginx -t
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Gradle 의존성을 실행마다 Maven Central에서 다시 받지 않는다(잦은 푸시에 429 Too Many Requests로 실패했다).
          cache: gradle
          cache-dependency-path: |
            toadyWebApi/*.gradle*
            toadyScheduler/*.gradle*
            toadyAdmin/*.gradle*
            toadyWebApi/gradle/wrapper/gradle-wrapper.properties
            toadyScheduler/gradle/wrapper/gradle-wrapper.properties
            toadyAdmin/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: toadyReactWeb/package-lock.json
      - name: Test API
        working-directory: toadyWebApi
        env:
          TOADY_TEST_REDIS_HOST: 127.0.0.1
        run: bash ./gradlew --no-daemon test
      - name: Test scheduler (external integration tests stay opt-in)
        working-directory: toadyScheduler
        run: bash ./gradlew --no-daemon test
      - name: Test admin site
        working-directory: toadyAdmin
        run: bash ./gradlew --no-daemon test
      - name: Build frontend
        working-directory: toadyReactWeb
        run: |
          npm ci
          npm test
          npm run build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            toadyWebApi/build/reports/tests/
            toadyScheduler/build/reports/tests/
            toadyAdmin/build/reports/tests/

  verify-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4.9
        env:
          MARIADB_ROOT_PASSWORD: ci-test-password
          MARIADB_DATABASE: toady_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Gradle 의존성을 실행마다 Maven Central에서 다시 받지 않는다(잦은 푸시에 429 Too Many Requests로 실패했다).
          cache: gradle
          cache-dependency-path: |
            toadyWebApi/*.gradle*
            toadyScheduler/*.gradle*
            toadyAdmin/*.gradle*
            toadyWebApi/gradle/wrapper/gradle-wrapper.properties
            toadyScheduler/gradle/wrapper/gradle-wrapper.properties
            toadyAdmin/gradle/wrapper/gradle-wrapper.properties
      - name: Prepare isolated schema fixture
        env:
          DB_CONTAINER: ${{ job.services.mariadb.id }}
        run: >-
          docker exec "$DB_CONTAINER" mariadb -uroot -pci-test-password toady_test
          -e 'CREATE TABLE TB_URBTY_OFCTL_LTTOT_PBLANC_MDL (ID BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY, HOUSE_MANAGE_NO VARCHAR(40), PBLANC_NO VARCHAR(40), MODEL_NO VARCHAR(4), TP VARCHAR(10), SUPLY_AMOUNT VARCHAR(20)) ENGINE=InnoDB'
      - name: Verify MariaDB SQL and transactions on temporary tables
        working-directory: toadyWebApi
        env:
          TOADY_TEST_DB_URL: jdbc:mariadb://127.0.0.1:3306/toady_test
          TOADY_TEST_DB_USERNAME: root
          TOADY_TEST_DB_PASSWORD: ci-test-password
        run: bash ./gradlew --no-daemon mariadbTest -Dtoady.mariadb.temporary.enabled=true
      - name: Verify scheduler MariaDB-only SQL (lock, upsert, insert-select, retention delete)
        env:
          DB_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          result="$(docker exec -i "$DB_CONTAINER" mariadb -uroot -pci-test-password toady_test -N < scripts/tests/scheduler-mariadb-smoke.sql | tail -1)"
          echo "result: $result"
          test "$result" = "lock=1 release=1 req=20 schedules=1 messages=1"
      - name: Upload MariaDB test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-test-reports
          path: toadyWebApi/build/reports/tests/mariadbTest/

  build-and-deploy:
    needs: [verify, verify-mariadb]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 직전 푸시 커밋과 비교해 바뀐 프로젝트만 빌드하므로 이력을 모두 받는다.
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      # 직전 푸시 커밋 이후 폴더가 바뀌지 않았고 그 커밋의 이미지가 Docker Hub에 있으면 다시 빌드하지 않는다.
      # 수동 실행, 이력을 비교할 수 없는 푸시(강제 푸시 등), 직전 이미지가 없는 경우는 모두 빌드한다.
      - name: Detect changed projects
        id: changes
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          full=""
          if [ "$EVENT_NAME" != push ] || [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then full=1; fi
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          for entry in web:toadyReactWeb:toady-react-web api:toadyWebApi:toady-web-api scheduler:toadyScheduler:toady-scheduler admin:toadyAdmin:toady-admin; do
            IFS=: read -r key dir image <<< "$entry"
            build=true
            if [ -z "$full" ] && git diff --quiet "$BASE_SHA" HEAD -- "$dir" \
              && docker buildx imagetools inspect "$DOCKER_USERNAME/$image:$BASE_SHA" > /dev/null 2>&1; then
              build=false
            fi
            echo "$key=$build" >> "$GITHUB_OUTPUT"
            echo "$dir: build=$build"
          done
      # 빌드 캐시(GitHub Actions 캐시)로 의존성 레이어를 재사용한다. 의존성 파일이 그대로면 Maven Central·npm에서 다시 받지 않는다.
      # provenance를 끄면 이미지 하나짜리 매니페스트가 되어, 바뀌지 않은 이미지에 새 태그만 붙이기 쉽다.
      - name: Check frontend build secret
        if: steps.changes.outputs.web == 'true'
        env:
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
        run: '[ -n "$VITE_KAKAO_MAP_KEY" ] || { echo "Set the VITE_KAKAO_MAP_KEY GitHub Actions secret before deploying" >&2; exit 1; }'
      - name: Build web image
        if: steps.changes.outputs.web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./toadyReactWeb
          push: true
          provenance: false
          build-args: VITE_KAKAO_MAP_KEY=${{ secrets.VITE_KAKAO_MAP_KEY }}
          tags: ${{ secrets.DOCKER_USERNAME }}/toady-react-web:${{ github.sha }}
          cache-from: type=gha,scope=toady-react-web
          cache-to: type=gha,mode=max,scope=toady-react-web,ignore-error=true
      - name: Build API image
        if: steps.changes.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./toadyWebApi
          push: true
          provenance: false
          tags: ${{ secrets.DOCKER_USERNAME }}/toady-web-api:${{ github.sha }}
          cache-from: type=gha,scope=toady-web-api
          cache-to: type=gha,mode=max,scope=toady-web-api,ignore-error=true
      - name: Build scheduler image
        if: steps.changes.outputs.scheduler == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./toadyScheduler
          push: true
          provenance: false
          tags: ${{ secrets.DOCKER_USERNAME }}/toady-scheduler:${{ github.sha }}
          cache-from: type=gha,scope=toady-scheduler
          cache-to: type=gha,mode=max,scope=toady-scheduler,ignore-error=true
      - name: Build admin image
        if: steps.changes.outputs.admin == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./toadyAdmin
          push: true
          provenance: false
          tags: ${{ secrets.DOCKER_USERNAME }}/toady-admin:${{ github.sha }}
          cache-from: type=gha,scope=toady-admin
          cache-to: type=gha,mode=max,scope=toady-admin,ignore-error=true
      # 바뀌지 않은 이미지는 직전 커밋 이미지에 이 커밋 태그만 붙인다(레지스트리 안에서 복사, 내려받지 않음).
      # 그래서 커밋 태그마다 이미지 4개가 모두 있고, 서버의 롤백·수동 실행은 지금처럼 태그 하나로 동작한다.
      - name: Reuse unchanged images under this commit tag
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          BASE_SHA: ${{ steps.changes.outputs.base }}
          WEB: ${{ steps.changes.outputs.web }}
          API: ${{ steps.changes.outputs.api }}
          SCHEDULER: ${{ steps.changes.outputs.scheduler }}
          ADMIN: ${{ steps.changes.outputs.admin }}
        run: |
          set -eu
          for entry in "$WEB:toady-react-web" "$API:toady-web-api" "$SCHEDULER:toady-scheduler" "$ADMIN:toady-admin"; do
            built="${entry%%:*}"; image="${entry#*:}"
            if [ "$built" = false ]; then
              docker buildx imagetools create -t "$DOCKER_USERNAME/$image:$IMAGE_TAG" "$DOCKER_USERNAME/$image:$BASE_SHA"
              echo "$image: reused $BASE_SHA"
            fi
          done
      - name: Copy deployment files to EC2
        # 서버 SSH 키를 받는 서드파티 Action은 태그가 옮겨져도 바뀌지 않도록 커밋 SHA로 고정한다(v0.1.7).
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml,scripts/check-deployment.sh
          # 바로 덮어쓰지 않고 받아 두었다가, 배포 스크립트가 이전 파일을 보관한 뒤 교체한다(롤백 때 함께 되돌린다).
          target: ~/toady/.incoming/
      - name: Deploy and verify
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME,IMAGE_TAG
          # 확인(앱별 최대 약 150초) 실패 시 롤백과 재확인까지 끝나도록 기본 10분보다 넉넉히 둔다. 중간에 끊기면 반쯤 되돌린 상태로 남는다.
          command_timeout: 30m
          script: |
            set -eu
            cd ~/toady
            export DOCKER_USERNAME IMAGE_TAG
            NEW_TAG="$IMAGE_TAG"
            APPS="toadyWebApi toadyScheduler toadyReactWeb"
            # 관리자 사이트(toadyAdmin)는 서버의 설정 파일(toadyAdmin/.env.prod)을 채운 뒤부터 함께 배포한다.
            # compose는 env_file이 없으면 설정 검사에서 실패하므로 빈 파일을 먼저 둔다(비어 있으면 관리자 컨테이너는 띄우지 않는다).
            mkdir -p toadyAdmin
            [ -f toadyAdmin/.env.prod ] || { : > toadyAdmin/.env.prod; chmod 600 toadyAdmin/.env.prod; }
            if [ -s toadyAdmin/.env.prod ]; then APPS="$APPS toadyAdmin"; fi
            # 마지막으로 검증에 성공한 태그. 새 이미지가 확인을 통과하지 못하면 이 태그로 되돌린다.
            PREVIOUS_TAG=""
            if [ -f .deployed-image-tag ]; then PREVIOUS_TAG=$(tr -d '[:space:]' < .deployed-image-tag); fi
            # 새 compose·확인 스크립트를 설치하기 전에 지금 파일을 보관한다. 배포가 실패하면 이미지 태그와 함께 되돌린다.
            mkdir -p .rollback/scripts
            [ ! -f docker-compose.yml ] || cp -p docker-compose.yml .rollback/docker-compose.yml
            [ ! -f scripts/check-deployment.sh ] || cp -p scripts/check-deployment.sh .rollback/scripts/check-deployment.sh
            restore_config() {
              [ ! -f .rollback/docker-compose.yml ] || cp -p .rollback/docker-compose.yml docker-compose.yml
              [ ! -f .rollback/scripts/check-deployment.sh ] || cp -p .rollback/scripts/check-deployment.sh scripts/check-deployment.sh
            }
            mkdir -p scripts
            cp .incoming/docker-compose.yml docker-compose.yml
            cp .incoming/scripts/check-deployment.sh scripts/check-deployment.sh
            # 새 태그 이미지가 지금 컨테이너와 같은 앱은 다시 만들지 않는다(CI가 바뀌지 않은 앱은 직전 이미지에 태그만 붙인다).
            # 이미지 ID로 비교하므로 직전 배포가 실패·롤백돼 서버가 더 오래된 이미지를 쓰고 있어도 필요한 앱은 교체된다.
            # compose 파일이 바뀌었거나 컨테이너가 없거나 멈춰 있으면 다시 만든다.
            RESTART=""
            image_of() {
              case "$1" in
                toadyWebApi) echo toady-web-api ;; toadyScheduler) echo toady-scheduler ;;
                toadyReactWeb) echo toady-react-web ;; toadyAdmin) echo toady-admin ;;
              esac
            }
            # 서버 설정 파일(앱 폴더의 .env.prod)이 지난 성공 배포 뒤 바뀌었는지. 기록(.deployed-env-sums)이 없으면 바뀌지 않은 것으로 본다.
            env_sum() { if [ -f "$1/.env.prod" ]; then cksum < "$1/.env.prod" | awk '{print $1 "-" $2}'; else echo none; fi; }
            recorded_sum() { [ ! -f .deployed-env-sums ] || awk -v key="$1" '$1 == key { print $2 }' .deployed-env-sums; }
            # Redis 설정 표시: compose의 redis 서비스 부분 + 비밀번호 줄. 바뀌면 Redis를 다시 만든다(기록이 없으면 한 번 다시 만든다).
            redis_sum() { { awk '/^  redis:/ { f = 1; print; next } f && /^  [A-Za-z]/ { f = 0 } f' docker-compose.yml; grep '^REDIS_PASSWORD=' toadyWebApi/.env.prod; } | cksum | awk '{print $1 "-" $2}'; }
            start_redis() {
              if [ "$(recorded_sum redis)" != "$(redis_sum)" ]; then
                echo "redis settings changed: recreating redis"
                docker-compose -p toady up -d --force-recreate redis
              else
                docker-compose -p toady up -d --no-recreate redis
              fi
            }
            select_restart() {
              RESTART=""
              compose_changed=""
              cmp -s .rollback/docker-compose.yml docker-compose.yml 2>/dev/null || compose_changed=1
              for app in $APPS; do
                recorded=$(recorded_sum "$app")
                env_changed=""
                if [ -n "$recorded" ] && [ "$recorded" != "$(env_sum "$app")" ]; then env_changed=1; fi
                want=$(docker image inspect -f '{{.Id}}' "$DOCKER_USERNAME/$(image_of "$app"):$NEW_TAG" 2>/dev/null || true)
                have=$(docker inspect -f '{{.Image}}' "$app" 2>/dev/null || true)
                running=$(docker inspect -f '{{.State.Running}}' "$app" 2>/dev/null || true)
                if [ -n "$compose_changed" ] || [ -n "$env_changed" ] || [ -z "$want" ] || [ "$want" != "$have" ] || [ "$running" != true ]; then
                  RESTART="$RESTART $app"
                fi
              done
              RESTART="${RESTART# }"
              echo "apps to restart: ${RESTART:-none}"
            }
            # 바뀐 앱 컨테이너만 다시 만든다. --no-deps로 compose 설정이 바뀌어도 mariadb·nginx를 다시 만들지 않는다.
            start_apps() {
              [ -n "$RESTART" ] || return 0
              # 앞단 nginx는 업스트림 IP를 기억한다. 앱 컨테이너를 다시 만든 뒤 설정을 다시 읽혀 502를 막는다.
              docker-compose -p toady up -d --no-deps $RESTART && { { docker exec nginx nginx -t >/dev/null 2>&1 && docker exec nginx nginx -s reload; } || echo "WARNING: front nginx config test failed; not reloaded (check conf.d on the server)" >&2; }
            }
            # set -e는 if 조건 안에서 꺼지므로 pull·up·확인 중 어느 단계가 실패해도 같은 롤백 경로로 들어온다.
            deploy_failed=""
            if ! docker-compose -p toady config -q; then
              # 새 설정 자체가 잘못됐으면 컨테이너를 건드리지 않고 이전 설정으로 되돌린 뒤 끝낸다.
              restore_config
              echo "DEPLOY FAILED: $NEW_TAG (docker-compose.yml is invalid). Previous configuration restored; containers unchanged." >&2
              exit 1
            elif ! grep -Eq '^REDIS_PASSWORD=.{16,}' toadyWebApi/.env.prod; then
              # Redis 컨테이너와 API가 같은 비밀번호를 이 파일에서 읽는다. 없으면 컨테이너를 건드리지 않고 끝낸다.
              restore_config
              echo "DEPLOY FAILED: $NEW_TAG (REDIS_PASSWORD (16+ chars) is missing in toadyWebApi/.env.prod; see README). Previous configuration restored; containers unchanged." >&2
              exit 1
            elif ! docker-compose -p toady pull $APPS; then
              deploy_failed="image pull failed"
            # Redis는 앱과 따로 둔다: 없으면 띄우고, 설정이 바뀌었을 때만 다시 만든다(배포 때 요청 제한·캐시가 비지 않게).
            elif ! start_redis; then
              deploy_failed="redis start failed"
            elif ! select_restart || ! start_apps; then
              deploy_failed="docker-compose up failed"
            elif ! bash scripts/check-deployment.sh; then
              deploy_failed="deployment checks failed"
            fi
            if [ -n "$deploy_failed" ]; then
              if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$NEW_TAG" ]; then
                echo "DEPLOY FAILED: $NEW_TAG ($deploy_failed). Rolling back app containers and compose files to $PREVIOUS_TAG." >&2
                restore_config
                export IMAGE_TAG="$PREVIOUS_TAG"
                if [ -z "$RESTART" ]; then
                  echo "DEPLOY FAILED before any app container was replaced; app containers unchanged ($PREVIOUS_TAG)." >&2
                elif ! start_apps; then
                  echo "ROLLBACK FAILED: docker-compose up for $PREVIOUS_TAG failed. Inspect the server manually." >&2
                elif bash scripts/check-deployment.sh; then
                  echo "ROLLBACK OK: app containers are running $PREVIOUS_TAG. DB changes are not rolled back." >&2
                else
                  echo "ROLLBACK CHECK FAILED: $PREVIOUS_TAG also failed checks. Inspect the server manually." >&2
                fi
              else
                restore_config
                echo "DEPLOY FAILED: $NEW_TAG ($deploy_failed) and no previous successful tag is recorded. Compose files restored; containers not rolled back." >&2
              fi
              exit 1
            fi
            # 성공 기록: 태그 파일과 .env의 IMAGE_TAG를 같은 태그로 맞춘다.
            # 서버에서 직접 docker-compose를 실행해도(예: certbot 갱신, 재시작) 배포한 태그를 쓰도록 .env의 IMAGE_TAG 줄만 바꾼다.
            # 같은 폴더의 임시 파일에 쓰고 mv로 교체해 중간 상태가 남지 않게 하고, 기존 .env 권한을 유지한다.
            umask 077
            tag_tmp=$(mktemp .deployed-image-tag.XXXXXX)
            env_tmp=$(mktemp .env.XXXXXX)
            trap 'rm -f "$tag_tmp" "$env_tmp" "${sums_tmp:-}"' EXIT
            # cp -p로 기존 권한을 먼저 옮긴 뒤 내용을 덮어쓴다(리다이렉션은 권한을 바꾸지 않는다).
            [ ! -f .deployed-image-tag ] || cp -p .deployed-image-tag "$tag_tmp"
            printf '%s\n' "$NEW_TAG" > "$tag_tmp"
            if [ -f .env ]; then
              cp -p .env "$env_tmp"
              { grep -v '^IMAGE_TAG=' .env || true; } > "$env_tmp"
            fi
            printf 'IMAGE_TAG=%s\n' "$NEW_TAG" >> "$env_tmp"
            mv -f "$env_tmp" .env
            mv -f "$tag_tmp" .deployed-image-tag
            # 이번 배포가 반영한 설정 파일·Redis 설정을 기록한다(다음 배포에서 바뀐 것만 다시 만들기 위해).
            sums_tmp=$(mktemp .deployed-env-sums.XXXXXX)
            { for app in $APPS; do echo "$app $(env_sum "$app")"; done; echo "redis $(redis_sum)"; } > "$sums_tmp"
            mv -f "$sums_tmp" .deployed-env-sums
            echo "DEPLOY OK: $NEW_TAG recorded in .deployed-image-tag and .env"
            # 배포마다 이미지 4개를 받아 디스크가 차면 MariaDB까지 멈추므로, 만든 지 14일이 넘은 이미지를 지운다(마지막 사용 시각 기준이 아님).
            # 실행 중인 컨테이너의 이미지는 지우지 않는다. 되돌릴 이전 이미지가 지워졌으면 compose가 Docker Hub에서 다시 받는다.
            docker image prune -af --filter "until=336h" >/dev/null 2>&1 || echo "image prune skipped" >&2
            df -h / | tail -1 | awk '{print "disk used: " $5 " of " $2}'
