name: Toady CI/CD Pipeline

on:
  push:
    branches: [ "master" ] # master 브랜치에 푸시될 때만 자동 배포 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHub 최신 소스코드 가져오기
    - name: Checkout Source Code
      uses: actions/checkout@v3

    # 2. 방금 등록한 Secret으로 Docker Hub 로그인
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. 3개의 모듈을 각각 빌드하고 Docker Hub에 업로드
    - name: Build and Push Docker Images
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/toady-react-web ./toadyReactWeb
        docker push ${{ secrets.DOCKER_USERNAME }}/toady-react-web
        
        docker build -t ${{ secrets.DOCKER_USERNAME }}/toady-web-api ./toadyWebApi
        docker push ${{ secrets.DOCKER_USERNAME }}/toady-web-api
        
        docker build -t ${{ secrets.DOCKER_USERNAME }}/toady-scheduler ./toadyScheduler
        docker push ${{ secrets.DOCKER_USERNAME }}/toady-scheduler

    # 4. 루트에 있는 docker-compose.yml 파일을 AWS EC2의 ~/toady/ 폴더로 전송
    - name: Copy docker-compose to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "docker-compose.yml"
        target: "~/toady/"

    # 5. AWS EC2에 SSH로 원격 접속하여 컨테이너 재실행
    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/toady
          DOCKER_USERNAME=dukkeoba docker-compose pull
          DOCKER_USERNAME=dukkeoba docker-compose -p toady up -d
          DOCKER_USERNAME=dukkeoba docker image prune -f