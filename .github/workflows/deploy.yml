name: Toady CI/CD Pipeline

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# Keep deployments serial; never interrupt a deployment halfway through.
concurrency:
  group: toady-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository files
        run: |
          python3 scripts/check-repository.py
          python3 -m unittest discover -s scripts/tests -v
      # 배포 이미지와 같은 nginx로 설정 문법을 미리 검사한다. 설정 오류는 배포 후 웹 컨테이너 재시작 반복으로만 드러나기 때문이다.
      # 웹 이미지는 nginx.conf를 템플릿으로 두고 켜질 때 TOADY_API_UPSTREAM을 채우므로(Dockerfile) 같은 방식으로 띄워 검사한다.
      - name: Check nginx config
        run: docker run --rm -e TOADY_API_UPSTREAM=toadyWebApi-blue:8080 -e NGINX_ENVSUBST_FILTER='^TOADY_' -v "$PWD/toadyReactWeb/nginx.conf:/etc/nginx/templates/default.conf.template:ro" nginx:1.30-alpine nginx -t
      # 앞단 nginx 설정(nginx/toady.conf)도 같은 이미지로 검사한다. 인증서 파일이 있어야 문법 검사가 끝나므로 임시 자체 서명 인증서를 둔다.
      - name: Check front nginx config
        run: |
          ssl="$RUNNER_TEMP/ssl/live/toady.co.kr-0002"
          mkdir -p "$ssl"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=ci.toady.test" -keyout "$ssl/privkey.pem" -out "$ssl/fullchain.pem" 2>/dev/null
          docker run --rm -v "$PWD/nginx/toady.conf:/etc/nginx/conf.d/default.conf:ro" -v "$PWD/nginx/admin-allow.inc.example:/etc/nginx/conf.d/admin-allow.inc:ro" -v "$PWD/nginx/toady-color.inc.example:/etc/nginx/conf.d/toady-color.inc:ro" -v "$RUNNER_TEMP/ssl:/etc/nginx/ssl:ro" nginx:1.30-alpine nginx -t
      # 블루/그린 서비스(YAML 병합·profiles)가 compose에서 제대로 풀리는지 확인한다. 서버의 env_file 경로에 빈 파일을 둔다.
      - name: Check compose file
        run: |
          for app in toadyWebApi toadyScheduler toadyAdmin; do sudo mkdir -p "/home/ec2-user/toady/$app" && sudo touch "/home/ec2-user/toady/$app/.env.prod"; done
          IMAGE_TAG=ci docker compose -p toady config -q
          services=$(IMAGE_TAG=ci docker compose -p toady --profile blue --profile green config --services | LC_ALL=C sort | tr '\n' ' ')
          echo "services: $services"
          test "$services" = "certbot mariadb nginx toadyAdmin-blue toadyAdmin-green toadyReactWeb-blue toadyReactWeb-green toadyScheduler toadyWebApi-blue toadyWebApi-green "
          # 프로필 없이 실행하면(서버에서 직접 `up -d`) 색 스택은 뜨지 않아야 한다.
          default=$(IMAGE_TAG=ci docker compose -p toady config --services | LC_ALL=C sort | tr '\n' ' ')
          test "$default" = "certbot mariadb nginx toadyScheduler "
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Gradle 의존성을 실행마다 Maven Central에서 다시 받지 않는다(잦은 푸시에 429 Too Many Requests로 실패했다).
          cache: gradle
          cache-dependency-path: |
            toadyWebApi/*.gradle*
            toadyScheduler/*.gradle*
            toadyAdmin/*.gradle*
            toadyWebApi/gradle/wrapper/gradle-wrapper.properties
            toadyScheduler/gradle/wrapper/gradle-wrapper.properties
            toadyAdmin/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: toadyReactWeb/package-lock.json
      - name: Test API
        working-directory: toadyWebApi
        run: bash ./gradlew --no-daemon test
      - name: Test scheduler (external integration tests stay opt-in)
        working-directory: toadyScheduler
        run: bash ./gradlew --no-daemon test
      - name: Test admin site
        working-directory: toadyAdmin
        run: bash ./gradlew --no-daemon test
      - name: Build frontend
        working-directory: toadyReactWeb
        run: |
          npm ci
          npm test
          npm run build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            toadyWebApi/build/reports/tests/
            toadyScheduler/build/reports/tests/
            toadyAdmin/build/reports/tests/

  verify-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4.9
        env:
          MARIADB_ROOT_PASSWORD: ci-test-password
          MARIADB_DATABASE: toady_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Gradle 의존성을 실행마다 Maven Central에서 다시 받지 않는다(잦은 푸시에 429 Too Many Requests로 실패했다).
          cache: gradle
          cache-dependency-path: |
            toadyWebApi/*.gradle*
            toadyScheduler/*.gradle*
            toadyAdmin/*.gradle*
            toadyWebApi/gradle/wrapper/gradle-wrapper.properties
            toadyScheduler/gradle/wrapper/gradle-wrapper.properties
            toadyAdmin/gradle/wrapper/gradle-wrapper.properties
      - name: Prepare isolated schema fixture
        env:
          DB_CONTAINER: ${{ job.services.mariadb.id }}
        run: >-
          docker exec "$DB_CONTAINER" mariadb -uroot -pci-test-password toady_test
          -e 'CREATE TABLE TB_URBTY_OFCTL_LTTOT_PBLANC_MDL (ID BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY, HOUSE_MANAGE_NO VARCHAR(40), PBLANC_NO VARCHAR(40), MODEL_NO VARCHAR(4), TP VARCHAR(10), SUPLY_AMOUNT VARCHAR(20)) ENGINE=InnoDB'
      - name: Verify MariaDB SQL and transactions on temporary tables
        working-directory: toadyWebApi
        env:
          TOADY_TEST_DB_URL: jdbc:mariadb://127.0.0.1:3306/toady_test
          TOADY_TEST_DB_USERNAME: root
          TOADY_TEST_DB_PASSWORD: ci-test-password
        run: bash ./gradlew --no-daemon mariadbTest -Dtoady.mariadb.temporary.enabled=true
      - name: Verify scheduler MariaDB-only SQL (lock, upsert, insert-select, retention delete)
        env:
          DB_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          result="$(docker exec -i "$DB_CONTAINER" mariadb -uroot -pci-test-password toady_test -N < scripts/tests/scheduler-mariadb-smoke.sql | tail -1)"
          echo "result: $result"
          test "$result" = "lock=1 release=1 req=20 schedules=1 messages=1"
      - name: Upload MariaDB test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-test-reports
          path: toadyWebApi/build/reports/tests/mariadbTest/

  build-and-deploy:
    needs: [verify, verify-mariadb]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push commit-tagged images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
        run: |
          set -eu
          : "${VITE_KAKAO_MAP_KEY:?Set the VITE_KAKAO_MAP_KEY GitHub Actions secret before deploying}"
          docker build --build-arg VITE_KAKAO_MAP_KEY -t "$DOCKER_USERNAME/toady-react-web:$IMAGE_TAG" ./toadyReactWeb
          docker build -t "$DOCKER_USERNAME/toady-web-api:$IMAGE_TAG" ./toadyWebApi
          docker build -t "$DOCKER_USERNAME/toady-scheduler:$IMAGE_TAG" ./toadyScheduler
          docker build -t "$DOCKER_USERNAME/toady-admin:$IMAGE_TAG" ./toadyAdmin
          docker push "$DOCKER_USERNAME/toady-react-web:$IMAGE_TAG"
          docker push "$DOCKER_USERNAME/toady-web-api:$IMAGE_TAG"
          docker push "$DOCKER_USERNAME/toady-scheduler:$IMAGE_TAG"
          docker push "$DOCKER_USERNAME/toady-admin:$IMAGE_TAG"
      - name: Copy deployment files to EC2
        # 서버 SSH 키를 받는 서드파티 Action은 태그가 옮겨져도 바뀌지 않도록 커밋 SHA로 고정한다(v0.1.7).
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml,scripts/check-deployment.sh
          # 바로 덮어쓰지 않고 받아 두었다가, 배포 스크립트가 이전 파일을 보관한 뒤 교체한다(롤백 때 함께 되돌린다).
          target: ~/toady/.incoming/
      - name: Deploy and verify
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME,IMAGE_TAG
          # 확인(앱별 최대 약 150초) 실패 시 롤백과 재확인까지 끝나도록 기본 10분보다 넉넉히 둔다. 중간에 끊기면 반쯤 되돌린 상태로 남는다.
          command_timeout: 30m
          script: |
            set -eu
            cd ~/toady
            export DOCKER_USERNAME IMAGE_TAG
            NEW_TAG="$IMAGE_TAG"
            # 관리자 사이트(toadyAdmin)는 서버의 설정 파일(toadyAdmin/.env.prod)을 채운 뒤부터 함께 배포한다.
            # compose는 env_file이 없으면 설정 검사에서 실패하므로 빈 파일을 먼저 둔다(비어 있으면 관리자 컨테이너는 띄우지 않는다).
            mkdir -p toadyAdmin
            [ -f toadyAdmin/.env.prod ] || { : > toadyAdmin/.env.prod; chmod 600 toadyAdmin/.env.prod; }
            ADMIN_ENABLED=""
            if [ -s toadyAdmin/.env.prod ]; then ADMIN_ENABLED=1; fi
            # 마지막으로 검증에 성공한 태그. 새 이미지가 확인을 통과하지 못하면 스케줄러를 이 태그로 되돌린다.
            PREVIOUS_TAG=""
            if [ -f .deployed-image-tag ]; then PREVIOUS_TAG=$(tr -d '[:space:]' < .deployed-image-tag); fi
            # 새 compose·확인 스크립트를 설치하기 전에 지금 파일을 보관한다. 배포가 실패하면 함께 되돌린다.
            mkdir -p .rollback/scripts
            [ ! -f docker-compose.yml ] || cp -p docker-compose.yml .rollback/docker-compose.yml
            [ ! -f scripts/check-deployment.sh ] || cp -p scripts/check-deployment.sh .rollback/scripts/check-deployment.sh
            restore_config() {
              [ ! -f .rollback/docker-compose.yml ] || cp -p .rollback/docker-compose.yml docker-compose.yml
              [ ! -f .rollback/scripts/check-deployment.sh ] || cp -p .rollback/scripts/check-deployment.sh scripts/check-deployment.sh
            }
            mkdir -p scripts
            cp .incoming/docker-compose.yml docker-compose.yml
            cp .incoming/scripts/check-deployment.sh scripts/check-deployment.sh

            # ---- 무중단(블루/그린) 배포 ----
            # API·웹·관리자는 blue/green 두 벌이다. 지금 요청을 받는 색은 앞단 nginx의 conf.d/toady-color.inc가 정한다(nginx/toady.conf).
            # 쓰지 않는 색을 새 이미지로 띄워 준비를 확인한 뒤 앞단을 그 색으로 바꿔 reload하고, 확인을 통과하면 이전 색을 내린다.
            # 이전 색은 끝까지 그대로 두므로, 실패하면 앞단만 되돌리면 곧바로 이전 버전이 계속 응답한다.
            # 스케줄러는 동시에 두 개가 돌면 안 되어(수집 잠금, 시작할 때 이전 실행의 남은 작업을 중단 처리) 지금처럼 제자리에서 바꾼다.
            COLOR_FILE=/etc/nginx/conf.d/toady-color.inc
            # 색 이름 → 컨테이너 이름 뒤에 붙는 값. ""은 블루/그린 이전 이름(toadyWebApi 등)으로, 처음 전환할 때만 나온다.
            active_suffix() {
              case "$(docker exec nginx cat "$COLOR_FILE" 2>/dev/null | grep -v '^[[:space:]]*#' || true)" in
                *'"-blue"'*) echo "-blue" ;;
                *'"-green"'*) echo "-green" ;;
                *) echo "" ;;
              esac
            }
            # 서버 안 직접 포트(docker-compose.yml): 이전 이름 8080/8083, blue 18080/18083, green 28080/28083.
            api_port() { case "$1" in -blue) echo 18080 ;; -green) echo 28080 ;; *) echo 8080 ;; esac; }
            admin_port() { case "$1" in -blue) echo 18083 ;; -green) echo 28083 ;; *) echo 8083 ;; esac; }
            # 앞단 nginx가 보낼 색을 바꾼다. 파일을 바꾼 뒤 문법 검사가 통과할 때만 reload한다(실패하면 지금 설정이 유지된다).
            set_front() {
              docker exec nginx sh -c 'printf "map \$host \$toady_suffix { default \"%s\"; }\n" "$1" > "$2.next" && mv -f "$2.next" "$2"' sh "$1" "$COLOR_FILE" &&
                docker exec nginx nginx -t >/dev/null 2>&1 && docker exec nginx nginx -s reload
            }
            # 색 스택을 확인한다. $1이 1이면 앞단을 거치는 확인을 건너뛴다(전환 전).
            check_stack() {
              env API_CONTAINER="toadyWebApi$2" API_PORT="$(api_port "$2")" WEB_CONTAINER="toadyReactWeb$2" \
                ADMIN_CONTAINER="toadyAdmin$2" ADMIN_PORT="$(admin_port "$2")" SKIP_FRONT_CHECKS="$1" bash scripts/check-deployment.sh
            }
            remove_stack() {
              for name in "toadyWebApi$1" "toadyReactWeb$1" "toadyAdmin$1"; do
                docker stop -t 30 "$name" >/dev/null 2>&1 || true
                docker rm -f "$name" >/dev/null 2>&1 || true
              done
            }

            if ! docker-compose -p toady config -q; then
              # 새 설정 자체가 잘못됐으면 컨테이너를 건드리지 않고 이전 설정으로 되돌린 뒤 끝낸다.
              restore_config
              echo "DEPLOY FAILED: $NEW_TAG (docker-compose.yml is invalid). Previous configuration restored; containers unchanged." >&2
              exit 1
            fi
            if ! docker exec nginx nginx -T 2>/dev/null | grep -q 'toady_suffix'; then
              # 앞단 nginx가 아직 색 전환 설정(nginx/toady.conf + toady-color.inc)을 쓰지 않으면 새 색으로 보낼 수 없다(README의 서버 일회성 작업).
              restore_config
              echo "DEPLOY FAILED: $NEW_TAG (front nginx is not prepared for blue/green: install nginx/toady.conf and conf.d/toady-color.inc as described in README). Containers unchanged." >&2
              exit 1
            fi
            OLD_SUFFIX=$(active_suffix)
            if [ "$OLD_SUFFIX" = "-blue" ]; then NEW_SUFFIX="-green"; else NEW_SUFFIX="-blue"; fi
            COLOR_APPS="toadyWebApi$NEW_SUFFIX toadyReactWeb$NEW_SUFFIX"
            if [ -n "$ADMIN_ENABLED" ]; then COLOR_APPS="$COLOR_APPS toadyAdmin$NEW_SUFFIX"; fi
            echo "front nginx serves '${OLD_SUFFIX:-legacy}'; starting '$NEW_SUFFIX' with $NEW_TAG"

            # set -e는 if 조건 안에서 꺼지므로 어느 단계가 실패해도 같은 되돌리기 경로로 들어온다.
            deploy_failed=""
            scheduler_replaced=""
            switched=""
            if ! docker-compose -p toady pull $COLOR_APPS toadyScheduler; then
              deploy_failed="image pull failed"
            # 이전 색은 건드리지 않는다. 쓰지 않는 색이 남아 있으면(이전 실패 등) 새 이미지로 다시 만든다.
            elif ! docker-compose -p toady up -d --no-deps $COLOR_APPS; then
              deploy_failed="docker-compose up failed"
            elif ! { scheduler_replaced=1; docker-compose -p toady up -d --no-deps toadyScheduler; }; then
              deploy_failed="docker-compose up failed (scheduler)"
            # 앞단을 바꾸기 전에 새 색이 스스로 준비됐는지(헬스·DB·웹 응답·컨테이너 상태) 확인한다.
            elif ! check_stack 1 "$NEW_SUFFIX"; then
              deploy_failed="new stack readiness checks failed before switching"
            elif ! { switched=1; set_front "$NEW_SUFFIX"; }; then
              deploy_failed="front nginx switch failed"
            # 앞단을 거친 실제 서비스 경로까지 확인한다.
            elif ! check_stack "" "$NEW_SUFFIX"; then
              deploy_failed="deployment checks failed"
            fi

            if [ -n "$deploy_failed" ]; then
              echo "DEPLOY FAILED: $NEW_TAG ($deploy_failed). The previous stack '${OLD_SUFFIX:-legacy}' was kept running." >&2
              keep_new=""
              if [ -n "$switched" ]; then
                if set_front "$OLD_SUFFIX"; then
                  echo "front nginx switched back to '${OLD_SUFFIX:-legacy}'." >&2
                else
                  # 되돌리기 reload가 거부되면 앞단은 아직 새 색을 보고 있으므로 새 색을 내리지 않는다.
                  keep_new=1
                  echo "ROLLBACK FAILED: front nginx could not be switched back to '${OLD_SUFFIX:-legacy}'. '$NEW_SUFFIX' is left running. Inspect the server manually." >&2
                fi
              fi
              # 실패한 새 색은 내린다(컨테이너 로그는 check-deployment.sh가 .rollback/last-failure-*.log에 남겼다).
              [ -n "$keep_new" ] || remove_stack "$NEW_SUFFIX"
              restore_config
              if [ -n "$keep_new" ]; then
                :
              elif [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$NEW_TAG" ]; then
                export IMAGE_TAG="$PREVIOUS_TAG"
                if [ -n "$scheduler_replaced" ] && ! docker-compose -p toady up -d --no-deps toadyScheduler; then
                  echo "ROLLBACK FAILED: docker-compose up for the scheduler at $PREVIOUS_TAG failed. Inspect the server manually." >&2
                elif check_stack "" "$OLD_SUFFIX"; then
                  echo "ROLLBACK OK: front nginx serves '${OLD_SUFFIX:-legacy}' and the scheduler runs $PREVIOUS_TAG. DB changes are not rolled back." >&2
                else
                  echo "ROLLBACK CHECK FAILED: the previous stack '${OLD_SUFFIX:-legacy}' ($PREVIOUS_TAG) also failed checks. Inspect the server manually." >&2
                fi
              else
                echo "DEPLOY FAILED: $NEW_TAG ($deploy_failed) and no previous successful tag is recorded. Compose files restored; the scheduler was not rolled back." >&2
              fi
              exit 1
            fi
            # 성공 기록: 태그 파일과 .env의 IMAGE_TAG를 같은 태그로 맞춘다.
            # 서버에서 직접 docker-compose를 실행해도(예: certbot 갱신, 재시작) 배포한 태그를 쓰도록 .env의 IMAGE_TAG 줄만 바꾼다.
            # 같은 폴더의 임시 파일에 쓰고 mv로 교체해 중간 상태가 남지 않게 하고, 기존 .env 권한을 유지한다.
            umask 077
            tag_tmp=$(mktemp .deployed-image-tag.XXXXXX)
            env_tmp=$(mktemp .env.XXXXXX)
            trap 'rm -f "$tag_tmp" "$env_tmp"' EXIT
            # cp -p로 기존 권한을 먼저 옮긴 뒤 내용을 덮어쓴다(리다이렉션은 권한을 바꾸지 않는다).
            [ ! -f .deployed-image-tag ] || cp -p .deployed-image-tag "$tag_tmp"
            printf '%s\n' "$NEW_TAG" > "$tag_tmp"
            if [ -f .env ]; then
              cp -p .env "$env_tmp"
              { grep -v '^IMAGE_TAG=' .env || true; } > "$env_tmp"
            fi
            printf 'IMAGE_TAG=%s\n' "$NEW_TAG" >> "$env_tmp"
            mv -f "$env_tmp" .env
            mv -f "$tag_tmp" .deployed-image-tag
            echo "DEPLOY OK: $NEW_TAG recorded in .deployed-image-tag and .env; front nginx serves '$NEW_SUFFIX'"
            # reload 뒤에도 이전 nginx 작업자와 이전 웹 컨테이너가 처리 중인 요청을 마치도록 잠시 기다린 뒤 이전 색을 내린다.
            sleep "${DRAIN_SECONDS:-15}"
            remove_stack "$OLD_SUFFIX"
            echo "previous stack '${OLD_SUFFIX:-legacy}' removed"
            # 배포마다 이미지 4개를 받아 디스크가 차면 MariaDB까지 멈추므로, 만든 지 14일이 넘은 이미지를 지운다(마지막 사용 시각 기준이 아님).
            # 실행 중인 컨테이너의 이미지는 지우지 않는다. 되돌릴 이전 이미지가 지워졌으면 compose가 Docker Hub에서 다시 받는다.
            docker image prune -af --filter "until=336h" >/dev/null 2>&1 || echo "image prune skipped" >&2
            df -h / | tail -1 | awk '{print "disk used: " $5 " of " $2}'
