# Explicit maintenance task, separate from application startup/deployment.
services:
  migrate:
    image: flyway/flyway:10.20.1
    environment:
      FLYWAY_URL: ${MIGRATION_DB_URL:?Set MIGRATION_DB_URL}
      FLYWAY_USER: ${MIGRATION_DB_USERNAME:?Set MIGRATION_DB_USERNAME}
      FLYWAY_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE: 'false'
      FLYWAY_BASELINE_VERSION: '1'
      FLYWAY_CLEAN_DISABLED: 'true'
      FLYWAY_VALIDATE_MIGRATION_NAMING: 'true'
      FLYWAY_CONNECT_RETRIES: '10'
    volumes:
      - ./db/migration:/flyway/sql:ro
    networks:
      - database
    command: info

networks:
  database:
    external: true
    name: ${MIGRATION_NETWORK:-toady_default}
