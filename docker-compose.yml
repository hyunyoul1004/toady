version: '3.8'

# 컨테이너 콘솔 로그(docker json-file)는 기본으로 회전하지 않아 디스크를 채운다. 서비스마다 20MB×5개로 제한한다.
# 설정은 컨테이너를 다시 만들 때 적용된다(앱은 배포 때, mariadb·nginx는 직접 다시 만들 때).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mariadb:
    container_name: mariadb
    image: mariadb:11.4.9
    volumes:
      - /usr/local/dockerVolumes/toady/mariadb11.4.9/data:/var/lib/mysql
    environment:
      - TZ=Asia/Seoul
      # - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in toadyWebApi/.env.prod}
    ports:
      # 앱 컨테이너는 compose 네트워크(mariadb:3306)로 접속한다. 외부 DB 도구는 SSH 터널을 쓴다.
      - "127.0.0.1:3306:3306"
    restart: always
    logging: *default-logging

  toadyWebApi:
    container_name: toadyWebApi
    image: ${DOCKER_USERNAME:-dukkeoba}/toady-web-api:${IMAGE_TAG:?Set IMAGE_TAG (see .deployed-image-tag)}
    env_file:
      - /home/ec2-user/toady/toadyWebApi/.env.prod
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod
      # 운영은 https 출처만 허용한다(로컬 개발 출처는 application.yml 기본값에만 둔다).
      - CORS_ALLOWED_ORIGINS=https://toady.co.kr,https://www.toady.co.kr
      # 운영에서는 API 명세(Swagger UI·/v3/api-docs)를 공개하지 않는다.
      - SPRINGDOC_APIDOCS_ENABLED=false
      - SPRINGDOC_SWAGGERUI_ENABLED=false
    volumes:
      - /usr/local/dockerVolumes/toady/toadyWebApi/logs/:/app/logs/
    ports:
      # 외부 요청은 앞단 nginx를 거친다. 서버 안 배포 확인(127.0.0.1:8080)만 직접 접속한다.
      - "127.0.0.1:8080:8080"
    depends_on:
      - mariadb
    restart: always
    logging: *default-logging

  toadyScheduler:
    container_name: toadyScheduler
    image: ${DOCKER_USERNAME:-dukkeoba}/toady-scheduler:${IMAGE_TAG:?Set IMAGE_TAG (see .deployed-image-tag)}
    env_file:
      - /home/ec2-user/toady/toadyScheduler/.env.prod
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8082
    # 종료 시 진행 중인 수집 구간을 중단 상태로 기록할 시간을 준다(앱은 최대 20초 대기).
    stop_grace_period: 30s
    volumes:
      - /usr/local/dockerVolumes/toady/toadyScheduler/logs/:/app/logs/
    ports:
      # 화면 없이 /internal/health와 관리자 사이트용 내부 API(/internal/admin)만 연다. 직접 포트는 서버 안(배포 확인)에서만 연다.
      - "127.0.0.1:8082:8082"
    depends_on:
      - mariadb
    restart: always
    logging: *default-logging

  # 관리자 사이트. 서버의 toadyAdmin/.env.prod를 채운 뒤부터 배포 스크립트가 함께 띄운다.
  # 앞단 nginx가 https://www.toady.co.kr/admin/ 을 이 컨테이너로 보낸다(서버 nginx 설정, README 참고).
  toadyAdmin:
    container_name: toadyAdmin
    image: ${DOCKER_USERNAME:-dukkeoba}/toady-admin:${IMAGE_TAG:?Set IMAGE_TAG (see .deployed-image-tag)}
    env_file:
      - /home/ec2-user/toady/toadyAdmin/.env.prod
    environment:
      - TZ=Asia/Seoul
      - SERVER_PORT=8083
      - ADMIN_SECURE_COOKIE=true
      # 수집 실행·일정 변경은 같은 compose 네트워크의 스케줄러 내부 API로 요청한다.
      - SCHEDULER_BASE_URL=http://toadyScheduler:8082
    volumes:
      - /usr/local/dockerVolumes/toady/toadyAdmin/logs/:/app/logs/
    ports:
      # 직접 포트는 서버 안(배포 확인)에서만 연다.
      - "127.0.0.1:8083:8083"
    depends_on:
      - mariadb
      - toadyScheduler
    restart: always
    logging: *default-logging

  toadyReactWeb:
    container_name: toadyReactWeb
    image: ${DOCKER_USERNAME:-dukkeoba}/toady-react-web:${IMAGE_TAG:?Set IMAGE_TAG (see .deployed-image-tag)}
    environment:
      - TZ=Asia/Seoul
    restart: always
    logging: *default-logging

  nginx:
    container_name: nginx
    # 웹 컨테이너(toadyReactWeb/Dockerfile)·CI 문법 검사와 같은 버전. nginx 컨테이너를 다시 만들 때 적용된다.
    image: nginx:1.30-alpine
    environment:
      - TZ=Asia/Seoul
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - toadyWebApi
      - toadyReactWeb
    volumes:
      - /usr/local/dockerVolumes/nginx/nginx.conf:/etc/nginx/nginx.conf
      - /usr/local/dockerVolumes/nginx/conf.d:/etc/nginx/conf.d
      - /usr/local/dockerVolumes/nginx/logs/:/var/log/nginx/
      - /usr/local/dockerVolumes/resources/:/var/resources/
      - /usr/local/dockerVolumes/certbot/conf:/etc/nginx/ssl
      - /usr/local/dockerVolumes/certbot/data:/var/www/certbot
    restart: always
    logging: *default-logging

  # 최초 발급용. 갱신은 서버 cron에서 `docker-compose -p toady run --rm --no-deps certbot renew`로 실행한다(README 참고).
  # 만료 30일 전까지는 다시 발급하지 않아 Let's Encrypt 발급 한도를 소모하지 않는다.
  certbot:
    container_name: certbot
    # 갱신 때마다 검증하지 않은 최신 이미지를 받지 않도록 버전을 고정한다.
    image: certbot/certbot:v5.9.0
    depends_on:
      - nginx
    command: certonly --webroot --webroot-path=/var/www/certbot --email dbsgusduf@naver.com --agree-tos --no-eff-email --keep-until-expiring -d toady.co.kr -d www.toady.co.kr -d api.toady.co.kr
    volumes:
      - /usr/local/dockerVolumes/certbot/conf:/etc/letsencrypt
      - /usr/local/dockerVolumes/certbot/logs:/var/log/letsencrypt
      - /usr/local/dockerVolumes/certbot/data:/var/www/certbot
