version: '3.8'

services:
  mariadb:
    container_name: mariadb
    image: mariadb:11.4.9
    volumes:
      - /usr/local/dockerVolumes/toady/mariadb11.4.9/data:/var/lib/mysql
    environment:
      - TZ=Asia/Seoul
      # - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in toadyWebApi/.env.prod}
    ports:
      # 앱 컨테이너는 compose 네트워크(mariadb:3306)로 접속한다. 외부 DB 도구는 SSH 터널을 쓴다.
      - "127.0.0.1:3306:3306"
    restart: always

  toadyWebApi:
    container_name: toadyWebApi
    image: ${DOCKER_USERNAME:-dukkeoba}/toady-web-api:${IMAGE_TAG:-latest}
    env_file:
      - /home/ec2-user/toady/toadyWebApi/.env.prod
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,https://toady.co.kr,https://www.toady.co.kr,http://toady.co.kr,http://www.toady.co.kr
    volumes:
      - /usr/local/dockerVolumes/toady/toadyWebApi/logs/:/app/logs/
    ports:
      # 외부 요청은 앞단 nginx를 거친다. 서버 안 배포 확인(127.0.0.1:8080)만 직접 접속한다.
      - "127.0.0.1:8080:8080"
    depends_on:
      - mariadb
    restart: always

  toadyScheduler:
    container_name: toadyScheduler
    image: ${DOCKER_USERNAME:-dukkeoba}/toady-scheduler:${IMAGE_TAG:-latest}
    env_file:
      - /home/ec2-user/toady/toadyScheduler/.env.prod
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8082
    volumes:
      - /usr/local/dockerVolumes/toady/toadyScheduler/logs/:/app/logs/
    ports:
      # 관리자 화면은 https://www.toady.co.kr/admin/ (앞단 nginx)으로 접속한다. 직접 포트는 서버 안에서만 연다.
      - "127.0.0.1:8082:8082"
    depends_on:
      - mariadb
    restart: always

  toadyReactWeb:
    container_name: toadyReactWeb
    image: ${DOCKER_USERNAME:-dukkeoba}/toady-react-web:${IMAGE_TAG:-latest}
    environment:
      - TZ=Asia/Seoul
    restart: always

  nginx:
    container_name: nginx
    image: nginx:1.21.5
    environment:
      - TZ=Asia/Seoul
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - toadyWebApi
      - toadyReactWeb
    volumes:
      - /usr/local/dockerVolumes/nginx/nginx.conf:/etc/nginx/nginx.conf
      - /usr/local/dockerVolumes/nginx/conf.d:/etc/nginx/conf.d
      - /usr/local/dockerVolumes/nginx/logs/:/var/log/nginx/
      - /usr/local/dockerVolumes/resources/:/var/resources/
      - /usr/local/dockerVolumes/certbot/conf:/etc/nginx/ssl
      - /usr/local/dockerVolumes/certbot/data:/var/www/certbot
    restart: always

  certbot:
    container_name: certbot
    image: certbot/certbot:latest
    depends_on:
      - nginx
    command: certonly --webroot --webroot-path=/var/www/certbot --email dbsgusduf@naver.com --agree-tos --no-eff-email --force-renewal -d toady.co.kr -d www.toady.co.kr -d api.toady.co.kr
    volumes:
      - /usr/local/dockerVolumes/certbot/conf:/etc/letsencrypt
      - /usr/local/dockerVolumes/certbot/logs:/var/log/letsencrypt
      - /usr/local/dockerVolumes/certbot/data:/var/www/certbot
