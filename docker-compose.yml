version: '3.8'

# 컨테이너 콘솔 로그(docker json-file)는 기본으로 회전하지 않아 디스크를 채운다. 서비스마다 20MB×5개로 제한한다.
# 설정은 컨테이너를 다시 만들 때 적용된다(앱은 배포 때, mariadb·nginx는 직접 다시 만들 때).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# ------------------------------------------------------------------------------
# 무중단(블루/그린) 배포
# 사용자 요청을 받는 API·웹·관리자는 blue/green 두 벌(색 스택)로 정의한다. 배포는 쓰지 않는 색을 새 이미지로 먼저 띄우고,
# 준비되면 앞단 nginx가 가리키는 색(conf.d/toady-color.inc)을 바꿔 reload한 뒤 이전 색을 내린다(.github/workflows/deploy.yml).
# 같은 색끼리 짝을 이룬다: toadyReactWeb-blue는 toadyWebApi-blue로만 프록시하고(TOADY_API_UPSTREAM), toadyAdmin-blue도 toadyWebApi-blue에 부탁한다(API_BASE_URL).
# profiles로 묶어 두어 서비스 이름 없이 `docker-compose up -d`를 실행해도 두 색이 함께 뜨거나 운영 중인 색이 다시 만들어지지 않는다.
# 직접 포트는 서버 안(배포 확인)에서만 열며, 두 색이 동시에 떠 있을 수 있어 색마다 다르다.
#   API   blue 127.0.0.1:18080  green 127.0.0.1:28080
#   관리자 blue 127.0.0.1:18083  green 127.0.0.1:28083
# 스케줄러는 같은 시각에 두 개가 돌면 안 되므로(수집 잠금·재시작 시 남은 작업 정리) 한 벌로 두고 제자리에서 교체한다.
# ------------------------------------------------------------------------------
x-web-api: &web-api
  image: ${DOCKER_USERNAME:-dukkeoba}/toady-web-api:${IMAGE_TAG:?Set IMAGE_TAG (see .deployed-image-tag)}
  env_file:
    - /home/ec2-user/toady/toadyWebApi/.env.prod
  environment:
    - TZ=Asia/Seoul
    - SPRING_PROFILES_ACTIVE=prod
    # 운영은 https 출처만 허용한다(로컬 개발 출처는 application.yml 기본값에만 둔다).
    - CORS_ALLOWED_ORIGINS=https://www.toady.co.kr,https://toady.co.kr
    # 운영에서는 API 명세(Swagger UI·/v3/api-docs)를 공개하지 않는다.
    - SPRINGDOC_APIDOCS_ENABLED=false
    - SPRINGDOC_SWAGGERUI_ENABLED=false
  # 이전 색을 내릴 때 처리 중인 요청을 마칠 시간을 준다.
  stop_grace_period: 30s
  volumes:
    - /usr/local/dockerVolumes/toady/toadyWebApi/logs/:/app/logs/
  depends_on:
    - mariadb
  restart: always
  logging: *default-logging

x-admin: &admin
  image: ${DOCKER_USERNAME:-dukkeoba}/toady-admin:${IMAGE_TAG:?Set IMAGE_TAG (see .deployed-image-tag)}
  env_file:
    - /home/ec2-user/toady/toadyAdmin/.env.prod
  # environment는 색마다 적는다(같은 색 API 주소가 달라서. YAML 병합은 목록을 합치지 않는다).
  stop_grace_period: 30s
  volumes:
    - /usr/local/dockerVolumes/toady/toadyAdmin/logs/:/app/logs/
  depends_on:
    - mariadb
    - toadyScheduler
  restart: always
  logging: *default-logging

x-react-web: &react-web
  image: ${DOCKER_USERNAME:-dukkeoba}/toady-react-web:${IMAGE_TAG:?Set IMAGE_TAG (see .deployed-image-tag)}
  restart: always
  logging: *default-logging

services:
  mariadb:
    container_name: mariadb
    image: mariadb:11.4.9
    volumes:
      - /usr/local/dockerVolumes/toady/mariadb11.4.9/data:/var/lib/mysql
    environment:
      - TZ=Asia/Seoul
      # - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in toadyWebApi/.env.prod}
    ports:
      # 앱 컨테이너는 compose 네트워크(mariadb:3306)로 접속한다. 외부 DB 도구는 SSH 터널을 쓴다.
      - "127.0.0.1:3306:3306"
    restart: always
    logging: *default-logging

  toadyWebApi-blue:
    <<: *web-api
    container_name: toadyWebApi-blue
    profiles: ["blue"]
    ports:
      - "127.0.0.1:18080:8080"

  toadyWebApi-green:
    <<: *web-api
    container_name: toadyWebApi-green
    profiles: ["green"]
    ports:
      - "127.0.0.1:28080:8080"

  toadyReactWeb-blue:
    <<: *react-web
    container_name: toadyReactWeb-blue
    profiles: ["blue"]
    environment:
      - TZ=Asia/Seoul
      # 웹 컨테이너 nginx가 API 경로(공고 서버 HTML·사이트맵·캘린더 등)를 보낼 같은 색 API.
      - TOADY_API_UPSTREAM=toadyWebApi-blue:8080

  toadyReactWeb-green:
    <<: *react-web
    container_name: toadyReactWeb-green
    profiles: ["green"]
    environment:
      - TZ=Asia/Seoul
      # 웹 컨테이너 nginx가 API 경로(공고 서버 HTML·사이트맵·캘린더 등)를 보낼 같은 색 API.
      - TOADY_API_UPSTREAM=toadyWebApi-green:8080

  toadyScheduler:
    container_name: toadyScheduler
    image: ${DOCKER_USERNAME:-dukkeoba}/toady-scheduler:${IMAGE_TAG:?Set IMAGE_TAG (see .deployed-image-tag)}
    env_file:
      - /home/ec2-user/toady/toadyScheduler/.env.prod
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8082
    # 종료 시 진행 중인 수집 구간을 중단 상태로 기록할 시간을 준다(앱은 최대 20초 대기).
    stop_grace_period: 30s
    volumes:
      - /usr/local/dockerVolumes/toady/toadyScheduler/logs/:/app/logs/
    ports:
      # 화면 없이 /internal/health와 관리자 사이트용 내부 API(/internal/admin)만 연다. 직접 포트는 서버 안(배포 확인)에서만 연다.
      - "127.0.0.1:8082:8082"
    depends_on:
      - mariadb
    restart: always
    logging: *default-logging

  # 관리자 사이트. 서버의 toadyAdmin/.env.prod를 채운 뒤부터 배포 스크립트가 함께 띄운다.
  # 앞단 nginx가 https://admin.toady.co.kr/admin/ 을 지금 색의 컨테이너로 보낸다(nginx/toady.conf, README 참고).
  toadyAdmin-blue:
    <<: *admin
    container_name: toadyAdmin-blue
    profiles: ["blue"]
    environment:
      - TZ=Asia/Seoul
      - SERVER_PORT=8083
      - ADMIN_SECURE_COOKIE=true
      # 수집 실행·일정 변경은 같은 compose 네트워크의 스케줄러 내부 API로 요청한다.
      - SCHEDULER_BASE_URL=http://toadyScheduler:8082
      # 메일·푸시 발송 등은 같은 색 API에 부탁한다(.env.prod의 API_BASE_URL보다 우선한다).
      - API_BASE_URL=http://toadyWebApi-blue:8080
    ports:
      - "127.0.0.1:18083:8083"

  toadyAdmin-green:
    <<: *admin
    container_name: toadyAdmin-green
    profiles: ["green"]
    environment:
      - TZ=Asia/Seoul
      - SERVER_PORT=8083
      - ADMIN_SECURE_COOKIE=true
      # 수집 실행·일정 변경은 같은 compose 네트워크의 스케줄러 내부 API로 요청한다.
      - SCHEDULER_BASE_URL=http://toadyScheduler:8082
      # 메일·푸시 발송 등은 같은 색 API에 부탁한다(.env.prod의 API_BASE_URL보다 우선한다).
      - API_BASE_URL=http://toadyWebApi-green:8080
    ports:
      - "127.0.0.1:28083:8083"

  nginx:
    container_name: nginx
    # 웹 컨테이너(toadyReactWeb/Dockerfile)·CI 문법 검사와 같은 버전. nginx 컨테이너를 다시 만들 때 적용된다.
    image: nginx:1.30-alpine
    environment:
      - TZ=Asia/Seoul
    ports:
      - "80:80"
      - "443:443"
    # 앱 컨테이너 주소는 요청 때 Docker DNS로 찾으므로(nginx/toady.conf) 앱에 depends_on을 두지 않는다.
    # 앱은 색마다 이름이 달라(toadyWebApi-blue 등) 고정 이름에 묶으면 nginx를 다시 만들 때 쓰지 않는 색까지 뜬다.
    volumes:
      - /usr/local/dockerVolumes/nginx/nginx.conf:/etc/nginx/nginx.conf
      - /usr/local/dockerVolumes/nginx/conf.d:/etc/nginx/conf.d
      - /usr/local/dockerVolumes/nginx/logs/:/var/log/nginx/
      - /usr/local/dockerVolumes/resources/:/var/resources/
      - /usr/local/dockerVolumes/certbot/conf:/etc/nginx/ssl
      - /usr/local/dockerVolumes/certbot/data:/var/www/certbot
    restart: always
    logging: *default-logging

  # 최초 발급용. 갱신은 서버 cron에서 `docker-compose -p toady run --rm --no-deps certbot renew`로 실행한다(README 참고).
  # 만료 30일 전까지는 다시 발급하지 않아 Let's Encrypt 발급 한도를 소모하지 않는다.
  certbot:
    container_name: certbot
    # 갱신 때마다 검증하지 않은 최신 이미지를 받지 않도록 버전을 고정한다.
    # 이메일은 처음 계정을 만들 때만 쓰이고(서버의 기존 계정으로 갱신), 공개 저장소에 개인 주소를 두지 않기 위해 넣지 않는다.
    image: certbot/certbot:v5.9.0
    depends_on:
      - nginx
    command: certonly --webroot --webroot-path=/var/www/certbot --register-unsafely-without-email --agree-tos --no-eff-email --keep-until-expiring --key-type rsa --cert-name toady.co.kr-0002 --expand -d toady.co.kr -d www.toady.co.kr -d api.toady.co.kr -d admin.toady.co.kr
    volumes:
      - /usr/local/dockerVolumes/certbot/conf:/etc/letsencrypt
      - /usr/local/dockerVolumes/certbot/logs:/var/log/letsencrypt
      - /usr/local/dockerVolumes/certbot/data:/var/www/certbot
