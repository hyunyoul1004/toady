# ==============================================================================
# 1. HTTP (80) -> HTTPS (443) 리다이렉트 & Certbot SSL 인증 챌린지
# ==============================================================================
server {
    listen 80;
    server_name toady.co.kr www.toady.co.kr api.toady.co.kr;

    # Let's Encrypt Certbot SSL 인증서 발급/갱신 경로 (필수)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 요청은 HTTPS로 301 영구 이동
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# 2. 메인 서비스 HTTPS (443) - toady.co.kr & www.toady.co.kr
# ==============================================================================
server {
    listen 443 ssl http2;
    server_name toady.co.kr www.toady.co.kr;

    # SSL 인증서 경로 (docker-compose의 certbot 볼륨 매핑: /etc/nginx/ssl)
    ssl_certificate /etc/nginx/ssl/live/toady.co.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/toady.co.kr/privkey.pem;

    # 보안 및 성능 프로토콜/암호화 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 정적 업로드 리소스 디렉터리 매핑 (/var/resources/)
    location /resources/ {
        alias /var/resources/;
        expires 30d;
        access_log off;
    }

    # [백엔드 API 프록시] /api/ -> toadyWebApi 컨테이너 (8080)
    location /api/ {
        proxy_pass http://toadyWebApi:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # [백엔드 API 프록시] /webApi/ -> toadyWebApi 컨테이너 (8080)
    location /webApi/ {
        proxy_pass http://toadyWebApi:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # [프론트엔드 React 웹] 모든 기본 요청 -> toadyReactWeb 컨테이너 (80)
    location / {
        proxy_pass http://toadyReactWeb:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ==============================================================================
# 3. 서브도메인 HTTPS (443) - api.toady.co.kr (단독 백엔드 호출용)
# ==============================================================================
server {
    listen 443 ssl http2;
    server_name api.toady.co.kr;

    ssl_certificate /etc/nginx/ssl/live/toady.co.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/toady.co.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://toadyWebApi:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
