# TOADY 앞단 nginx (서버: /usr/local/dockerVolumes/nginx/conf.d/toady.conf)
# 저장소의 이 파일이 원본이다. 서버에 복사한 뒤 `docker exec nginx nginx -t && docker exec nginx nginx -s reload`로 적용한다.
# 인증서·비밀값은 넣지 않는다(인증서는 certbot이 서버 볼륨에 만든다).
#
# 도메인
#   www.toady.co.kr   서비스(표준 주소). toady.co.kr은 www로 보낸다.
#   api.toady.co.kr   API(웹과 같은 서버 블록)
#   admin.toady.co.kr 관리자 사이트(관리자 IP만 허용). 예전 주소 www.../admin은 이 도메인으로 보낸다.

# ------------------------------------------------------------------------------
# 컨테이너 주소는 요청할 때마다 Docker 내장 DNS로 다시 찾는다.
# upstream { server toadyWebApi:8080; } 방식은 nginx가 켜질 때 IP를 한 번만 찾아 기억해서,
# 배포로 API 컨테이너만 다시 만들면(IP 변경) nginx를 재시작할 때까지 502가 난다.
# proxy_pass에 변수를 쓰면 resolver로 매번(10초 캐시) 다시 찾는다.
# ------------------------------------------------------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ------------------------------------------------------------------------------
# 무중단(블루/그린) 배포: 지금 요청을 받는 색
# 앱 컨테이너 이름은 색이 붙는다(toadyWebApi-blue, toadyReactWeb-green 등. docker-compose.yml 참고).
# 어느 색으로 보낼지는 서버의 conf.d/toady-color.inc 한 파일이 정한다($toady_suffix: "-blue" 또는 "-green").
# 배포 스크립트가 새 색이 준비된 뒤 이 파일을 바꾸고 reload하며, 서버에서 직접 고치지 않는다(형식: nginx/toady-color.inc.example).
# 파일이 없으면 nginx -t가 실패하므로 reload가 거부되고 지금 설정이 그대로 유지된다.
# 색이 바뀌면 이름 자체가 달라지므로 resolver 캐시(10초)와 무관하게 reload 즉시 새 색으로 간다.
# ------------------------------------------------------------------------------
include /etc/nginx/conf.d/toady-color.inc;

# nginx 버전 숨기기(server_tokens off)는 서버의 nginx.conf(http 블록)에 이미 있다. 여기 다시 쓰면 중복 오류로 nginx가 켜지지 않는다.

# 공통 보안 헤더. location에 add_header가 있으면 상위 값이 상속되지 않으므로 그런 location에서는 다시 넣는다.
map $scheme $toady_hsts { https "max-age=31536000"; default ""; }

# ==============================================================================
# [HTTP 80] -> HTTPS 리다이렉트 & 인증서 갱신 챌린지
# ==============================================================================
server {
    listen 80;
    server_name toady.co.kr www.toady.co.kr api.toady.co.kr admin.toady.co.kr;

    access_log /var/log/nginx/toady_access.log;
    error_log /var/log/nginx/toady_error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # api·admin 도메인은 그대로 HTTPS로, 나머지(toady.co.kr·www)는 www로 표준화한다.
    location / {
        if ($host = api.toady.co.kr)   { return 301 https://api.toady.co.kr$request_uri; }
        if ($host = admin.toady.co.kr) { return 301 https://admin.toady.co.kr$request_uri; }
        return 301 https://www.toady.co.kr$request_uri;
    }
}

# ==============================================================================
# [HTTPS 443] toady.co.kr -> www.toady.co.kr
# ==============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name toady.co.kr;

    ssl_certificate     /etc/nginx/ssl/live/toady.co.kr-0002/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/toady.co.kr-0002/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security $toady_hsts always;
    return 301 https://www.toady.co.kr$request_uri;
}

# ==============================================================================
# [HTTPS 443] 메인 서비스 (www.toady.co.kr & api.toady.co.kr)
# ==============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name www.toady.co.kr api.toady.co.kr;
    charset utf-8;

    access_log /var/log/nginx/ssl_toady_access.log;
    error_log /var/log/nginx/ssl_toady_error.log;

    ssl_certificate     /etc/nginx/ssl/live/toady.co.kr-0002/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/toady.co.kr-0002/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # TLS 1.3에서는 쓰이지 않고, TLS 1.2에서도 기본 암호 목록이면 브라우저 선택을 따르는 편이 낫다(Mozilla intermediate 권장값).
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 요청 본문 상한(이야기·쪽지·푸시 구독 등 JSON). 기본 1m과 같지만 의도를 명시한다.
    client_max_body_size 1m;

    # 보안 헤더 (아래 location 중 add_header를 쓰는 곳은 상속되지 않는다)
    add_header Strict-Transport-Security $toady_hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 프록시 공통 헤더.
    # X-Real-IP는 반드시 접속자 주소로 덮어쓴다. API·관리자의 요청 제한·로그인 실패 제한이 이 값을 믿으므로,
    # 접속자가 보낸 X-Real-IP가 그대로 넘어가면 제한을 피할 수 있다. 아래 location에서 proxy_set_header를
    # 하나라도 새로 쓰면 이 값들이 상속되지 않으니, 그때는 X-Real-IP까지 다시 적는다.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    # 컨테이너 주소(요청 때마다 다시 찾는다). 포트까지 적어야 한다. 색($toady_suffix)은 위 toady-color.inc가 정한다.
    set $toady_web toadyReactWeb$toady_suffix:80;
    set $toady_api toadyWebApi$toady_suffix:8080;

    # --------------------------------------------------------------------------
    # 1) React 웹 (공개 페이지 /areas, /zupzup, /weekly, /calendar/*.ics 등은 웹 컨테이너 nginx가 API로 넘긴다)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://$toady_web;
    }

    # --------------------------------------------------------------------------
    # 2) API (/api/, /webApi/, 스웨거)
    # CORS 사전 요청(OPTIONS)은 Spring Security가 허용 출처 목록(toady.web.allowed-origins)으로 처리한다.
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://$toady_api;
    }
    location /webApi/ {
        proxy_pass http://$toady_api;
    }
    location /swagger-ui/ {
        proxy_pass http://$toady_api;
    }
    location /v3/api-docs {
        proxy_pass http://$toady_api;
    }

    # 컨테이너 내부 점검 주소(/internal)는 밖으로 열지 않는다.
    location ^~ /internal {
        return 404;
    }

    # --------------------------------------------------------------------------
    # 3) 관리자 사이트는 admin.toady.co.kr로 옮겼다. 예전 주소로 들어오면 그쪽으로 보낸다(접속 허용은 그 서버 블록이 판단).
    # --------------------------------------------------------------------------
    location ^~ /admin {
        return 301 https://admin.toady.co.kr$request_uri;
    }

    # --------------------------------------------------------------------------
    # 4) 정적 이미지 리소스 (/cont)
    # --------------------------------------------------------------------------
    location /cont {
        alias /var/resources;
        access_log off;
        expires 90d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security $toady_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}

# ==============================================================================
# [HTTPS 443] 관리자 사이트 (admin.toady.co.kr) — 관리자 IP에서만 접속한다.
# 수집 실행은 관리자 사이트가 스케줄러 내부 API로 요청하므로 스케줄러를 직접 열지 않는다.
# 관리자 앱의 주소는 그대로 /admin/... 이고, 첫 화면(/)은 /admin/으로 보낸다.
# ==============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name admin.toady.co.kr;
    charset utf-8;

    access_log /var/log/nginx/ssl_admin_access.log;
    error_log /var/log/nginx/ssl_admin_error.log;

    ssl_certificate     /etc/nginx/ssl/live/toady.co.kr-0002/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/toady.co.kr-0002/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;

    # 관리자 접속 IP만 허용한다(서버 블록 전체에 적용). 실제 IP는 공개 저장소에 두지 않고 서버의 파일에만 둔다.
    # 서버: /usr/local/dockerVolumes/nginx/conf.d/admin-allow.inc (형식은 nginx/admin-allow.inc.example). 확장자가 .conf가 아니라 자동으로 읽히지 않는다.
    # 파일 이름에 *를 둬서 파일이 없어도 nginx가 멈추지 않게 한다(그때는 아래 deny all로 관리자 사이트만 막힌다).
    include /etc/nginx/conf.d/admin-allow*.inc;
    deny all;

    add_header Strict-Transport-Security $toady_hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    # 관리자 화면은 검색에 노출하지 않는다(앱의 robots 메타와 함께).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 관리자 로그인 실패 제한이 X-Real-IP를 쓰므로 접속자 주소로 덮어쓴다.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    set $toady_admin toadyAdmin$toady_suffix:8083;

    location = / {
        return 302 /admin/;
    }
    location /admin {
        proxy_pass http://$toady_admin;
    }
    # 관리자 앱이 쓰지 않는 경로(내부 점검 /internal 등)는 열지 않는다.
    location / {
        return 404;
    }
}
