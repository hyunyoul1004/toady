spring:
  application:
    name: toady-admin
  config:
    # IntelliJ 등에서 바로 실행해도 로컬 설정을 읽는다(API의 .env와 같은 방식). 운영 컨테이너에는 이 파일이 없고 환경변수를 쓴다.
    import: optional:file:.env.local[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  thymeleaf:
    cache: true

server:
  port: ${SERVER_PORT:8083}
  # 앞단 nginx(HTTPS) 뒤에서 Tomcat이 Location을 http://내부주소 로 바꾸지 않게 상대 경로 그대로 보낸다.
  tomcat:
    use-relative-redirects: true
  servlet:
    session:
      # 아무 요청이 없으면 30분 뒤 로그아웃된다(로그인 유지를 고른 브라우저는 쿠키로 다시 로그인).
      timeout: 30m
      cookie:
        # 관리자 화면은 admin.toady.co.kr에서 열고(앞단 nginx), 앱 경로는 /admin 아래다. 쿠키는 그 경로로만 보내고 이름도 따로 둔다.
        # 도메인 속성을 두지 않아 host-only 쿠키가 되므로 www·api 요청에는 관리자 세션이 실리지 않는다.
        name: TOADY_ADMIN_SESSION
        path: /admin
        http-only: true
        same-site: strict
        secure: ${ADMIN_SECURE_COOKIE:false}

toady:
  site:
    # "사이트 열기"·"서비스에서 보기" 링크가 가리킬 서비스 주소(관리자와 도메인이 다르다).
    url: ${TOADY_SITE_URL:https://www.toady.co.kr}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    # 로그인 유지 쿠키의 서명 키(32자 이상 무작위 값, 예: openssl rand -hex 32)와 기간(일, 최대 30). 키가 없으면 로그인 유지를 끈다.
    remember-key: ${ADMIN_REMEMBER_KEY:}
    remember-days: ${ADMIN_REMEMBER_DAYS:14}
  mail:
    # 메일 현황 화면의 한도 표시. API와 같은 환경변수를 쓴다(값이 다르면 화면 표시만 달라진다).
    rolling-limit: ${GMAIL_ROLLING_LIMIT:400}
    auth-reserve: ${GMAIL_AUTH_RESERVE:100}
    signup-limit: ${GMAIL_SIGNUP_LIMIT:0}
  api:
    # 메일·푸시 발송처럼 API에서만 할 수 있는 일을 부탁하는 내부 주소와 토큰(API의 ADMIN_API_TOKEN과 같은 값, 32자 이상).
    base-url: ${API_BASE_URL:http://toadyWebApi:8080}
    token: ${ADMIN_API_TOKEN:}
  scheduler:
    # 같은 docker-compose 네트워크의 스케줄러 내부 주소. 토큰이 없으면 수집 화면은 조회 안내만 보여 준다.
    base-url: ${SCHEDULER_BASE_URL:http://toadyScheduler:8082}
    token: ${SCHEDULER_INTERNAL_TOKEN:}

logging:
  level:
    com.toady.admin: INFO
