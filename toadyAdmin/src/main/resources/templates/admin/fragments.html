<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title th:text="${title} + ' · TOADY 관리자'">TOADY 관리자</title><link rel="stylesheet" th:href="@{/admin/style.css}"></head>
<body>
<!-- 모든 관리자 화면의 상단 메뉴. 지금 화면(menu)을 표시하고, 로그아웃은 CSRF 토큰이 담긴 POST로 보낸다. -->
<header class="topbar" th:fragment="topbar"><div class="shell nav">
    <a class="brand" th:href="@{/admin/}"><span class="brand-mark">T</span> TOADY <span class="muted">/ 관리자</span></a>
    <nav class="account" aria-label="관리자 메뉴">
        <a class="nav-link" th:classappend="${menu == 'dashboard'} ? 'active'" th:href="@{/admin/}">지표</a>
        <a class="nav-link" th:classappend="${menu == 'members'} ? 'active'" th:href="@{/admin/members}">회원</a>
        <a class="nav-link" th:classappend="${menu == 'comments'} ? 'active'" th:href="@{/admin/comments}">댓글</a>
        <a class="nav-link" th:classappend="${menu == 'operations'} ? 'active'" th:href="@{/admin/operations}">공고·알림</a>
        <a class="nav-link" th:classappend="${menu == 'jobs'} ? 'active'" th:href="@{/admin/jobs}">수집</a>
        <span class="who" th:text="${username}">admin</span>
        <form th:action="@{/admin/logout}" method="post"><button class="quiet" type="submit">로그아웃</button></form>
    </nav>
</div></header>
<div th:fragment="flash"><div class="alert notice" th:if="${notice}" th:text="${notice}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div></div>
<!-- 목록 아래 페이지 이동. 검색 조건(base)을 유지한다. -->
<nav class="pager" th:fragment="pager(result, base)" th:if="${result.pages > 1}" aria-label="페이지">
    <a class="secondary" th:if="${result.page > 0}" th:href="${base + '&page=' + (result.page - 1)}">← 이전</a>
    <span class="muted" th:text="${(result.page + 1) + ' / ' + result.pages}"></span>
    <a class="secondary" th:if="${result.page + 1 < result.pages}" th:href="${base + '&page=' + (result.page + 1)}">다음 →</a>
</nav>
</body></html>
