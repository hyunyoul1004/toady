<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- 공통 head 조각. 다른 화면은 th:replace="~{admin/fragments :: head('제목')}"로 가져다 쓴다. noindex로 검색 노출을 막는다. -->
<head th:fragment="head(title)"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title th:text="${title} + ' · TOADY 관리자'">TOADY 관리자</title><link rel="stylesheet" th:href="@{/admin/style.css}"></head>
<body>
<!-- 모든 관리자 화면의 메뉴. 넓은 화면에서는 왼쪽 고정 메뉴, 920px 이하에서는 위쪽 막대의 '메뉴' 단추로 펼친다.
     지금 화면(menu)을 표시하고, 로그아웃은 CSRF 토큰이 담긴 POST로 보낸다. -->
<aside class="side" th:fragment="sidebar">
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <div class="side-top">
        <a class="brand" th:href="@{/admin/}"><span class="brand-mark">T</span> TOADY <span class="muted">관리자</span></a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="admin-menu"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span class="menu-label">메뉴</span></button>
    </div>
    <div class="side-panel" id="admin-menu">
        <nav class="side-nav" aria-label="관리자 메뉴">
            <p class="side-group">현황</p>
            <a th:classappend="${menu == 'dashboard'} ? 'active'" th:attr="aria-current=${menu == 'dashboard'} ? 'page' : null" th:href="@{/admin/}"><span aria-hidden="true">▦</span>대시보드</a>
            <p class="side-group">서비스</p>
            <a th:classappend="${menu == 'announcements'} ? 'active'" th:attr="aria-current=${menu == 'announcements'} ? 'page' : null" th:href="@{/admin/announcements}"><span aria-hidden="true">▤</span>공고</a>
            <a th:classappend="${menu == 'members'} ? 'active'" th:attr="aria-current=${menu == 'members'} ? 'page' : null" th:href="@{/admin/members}"><span aria-hidden="true">◉</span>회원</a>
            <a th:classappend="${menu == 'comments'} ? 'active'" th:attr="aria-current=${menu == 'comments'} ? 'page' : null" th:href="@{/admin/comments}"><span aria-hidden="true">✎</span>댓글</a>
            <a th:classappend="${menu == 'reports'} ? 'active'" th:attr="aria-current=${menu == 'reports'} ? 'page' : null" th:href="@{/admin/reports}"><span aria-hidden="true">⚑</span>신고<span class="nav-count" th:if="${openReports != null and openReports > 0}" th:text="${openReports}">0</span></a>
            <a th:classappend="${menu == 'moderation'} ? 'active'" th:attr="aria-current=${menu == 'moderation'} ? 'page' : null" th:href="@{/admin/moderation}"><span aria-hidden="true">⊘</span>금칙어</a>
            <a th:classappend="${menu == 'insights'} ? 'active'" th:attr="aria-current=${menu == 'insights'} ? 'page' : null" th:href="@{/admin/insights}"><span aria-hidden="true">↗</span>유입·커뮤니티 지표</a>
            <p class="side-group">콘텐츠</p>
            <a th:classappend="${menu == 'notices'} ? 'active'" th:attr="aria-current=${menu == 'notices'} ? 'page' : null" th:href="@{/admin/notices}"><span aria-hidden="true">▣</span>사이트 공지</a>
            <a th:classappend="${menu == 'faq'} ? 'active'" th:attr="aria-current=${menu == 'faq'} ? 'page' : null" th:href="@{/admin/faq}"><span aria-hidden="true">?</span>자주 묻는 질문</a>
            <a th:classappend="${menu == 'areas'} ? 'active'" th:attr="aria-current=${menu == 'areas'} ? 'page' : null" th:href="@{/admin/areas}"><span aria-hidden="true">⌂</span>생활권</a>
            <a th:classappend="${menu == 'push'} ? 'active'" th:attr="aria-current=${menu == 'push'} ? 'page' : null" th:href="@{/admin/push}"><span aria-hidden="true">✦</span>푸시 발송</a>
            <p class="side-group">운영</p>
            <a th:classappend="${menu == 'operations'} ? 'active'" th:attr="aria-current=${menu == 'operations'} ? 'page' : null" th:href="@{/admin/operations}"><span aria-hidden="true">◎</span>데이터·알림 상태</a>
            <a th:classappend="${menu == 'jobs'} ? 'active'" th:attr="aria-current=${menu == 'jobs'} ? 'page' : null" th:href="@{/admin/jobs}"><span aria-hidden="true">↻</span>수집 작업</a>
            <a th:classappend="${menu == 'locations'} ? 'active'" th:attr="aria-current=${menu == 'locations'} ? 'page' : null" th:href="@{/admin/locations}"><span aria-hidden="true">⌖</span>위치 확인</a>
            <a th:classappend="${menu == 'data-check'} ? 'active'" th:attr="aria-current=${menu == 'data-check'} ? 'page' : null" th:href="@{/admin/data-check}"><span aria-hidden="true">✓</span>데이터 점검</a>
            <a th:classappend="${menu == 'settings'} ? 'active'" th:attr="aria-current=${menu == 'settings'} ? 'page' : null" th:href="@{/admin/settings}"><span aria-hidden="true">⚙</span>서비스 설정</a>
            <a th:classappend="${menu == 'mail'} ? 'active'" th:attr="aria-current=${menu == 'mail'} ? 'page' : null" th:href="@{/admin/mail}"><span aria-hidden="true">✉</span>메일 발송 현황</a>
            <a th:classappend="${menu == 'audit'} ? 'active'" th:attr="aria-current=${menu == 'audit'} ? 'page' : null" th:href="@{/admin/audit}"><span aria-hidden="true">≣</span>작업 이력</a>
        </nav>
        <div class="side-foot"><span class="who" th:text="${username}">admin</span><a th:href="${siteUrl + '/'}" href="/" target="_blank" rel="noopener">사이트 열기 ↗</a>
            <form th:action="@{/admin/logout}" method="post"><button class="quiet" type="submit">로그아웃</button></form></div>
    </div>
    <div class="side-backdrop" aria-hidden="true"></div>
</aside>
<!-- 대상(회원·공고) 하나의 최근 관리자 작업. 열람 기록은 작업 이력 화면에서만 본다. -->
<section class="panel spaced" th:fragment="history(items)"><div class="panel-head"><h2>관리자 작업 이력</h2><a th:href="@{/admin/audit}">전체 이력 →</a></div>
    <p class="muted" th:if="${#lists.isEmpty(items)}">기록이 없습니다.</p>
    <ul class="audit-list" th:unless="${#lists.isEmpty(items)}"><li th:each="e : ${items}">
        <div><strong th:text="${e.actionLabel}"></strong><span class="muted" th:if="${e.before != null}" th:text="${e.before + ' → '}"></span><span th:if="${e.after != null}" th:text="${e.after}"></span></div>
        <small th:text="${(e.at != null ? #temporals.format(e.at, 'yyyy.MM.dd HH:mm') : '') + ' · ' + e.admin + (e.note != null ? ' · 메모: ' + e.note : '')}"></small></li></ul>
</section>
<!-- 리다이렉트 뒤 한 번만 보이는 안내(notice)·오류(error) 문구. 컨트롤러의 addFlashAttribute 값이다. -->
<div th:fragment="flash"><div class="alert notice" th:if="${notice}" th:text="${notice}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div></div>
<!-- 목록 아래 페이지 이동. 검색 조건(base)을 유지한다. -->
<nav class="pager" th:fragment="pager(result, base)" th:if="${result.pages > 1}" aria-label="페이지">
    <a class="secondary" th:if="${result.page > 0}" th:href="${base + '&page=' + (result.page - 1)}">← 이전</a>
    <span class="muted" th:text="${(result.page + 1) + ' / ' + result.pages}"></span>
    <a class="secondary" th:if="${result.page + 1 < result.pages}" th:href="${base + '&page=' + (result.page + 1)}">다음 →</a>
</nav>
</body></html>
