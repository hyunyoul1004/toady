<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('로그인')}"></head>
<body class="login-page"><main class="login-card">
    <a class="brand" th:href="@{/admin/}"><span class="brand-mark">T</span> TOADY <span class="muted">/ 관리자</span></a>
    <p class="eyebrow">SERVICE OPERATIONS</p><h1>관리자 로그인</h1><p class="muted">서비스 지표·회원·댓글과 데이터 수집을 관리합니다.</p>
    <div class="alert error" th:if="${param.error}">아이디 또는 비밀번호를 확인하세요.</div>
    <div class="alert error" th:if="${param.locked}">로그인 실패가 반복되어 15분 동안 로그인할 수 없습니다. 잠시 후 다시 시도하세요.</div>
    <div class="alert notice" th:if="${param.logout}">로그아웃했습니다.</div>
    <form th:action="@{/admin/login}" method="post" class="login-form">
        <label>관리자 아이디<input name="username" autocomplete="username" autofocus required></label>
        <label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">로그인 <span aria-hidden="true">→</span></button>
    </form>
    <p class="login-foot">TOADY · 관리자</p>
</main></body></html>
