server {
    listen 80;
    server_name localhost;

    # React 빌드 정적 파일 서빙 디렉터리
    root /usr/share/nginx/html;
    index index.html;

    # 공고별 서버 HTML: JS를 실행하지 않는 검색·공유 봇에도 핵심 정보 제공.
    # 서비스 DNS는 요청 시 해석해 API 컨테이너 교체 후에도 기존 IP에 묶이지 않는다.
    resolver 127.0.0.11 valid=10s;
    location ~ ^/announcements/(apt|urban|remaining|public-rental|optional)/([a-zA-Z0-9_-]+)/([a-zA-Z0-9_-]+)$ {
        set $api_host toadyWebApi:8080;
        rewrite ^/announcements/(.*)$ /api/v1/public/announcements/$1 break;
        proxy_pass http://$api_host;
        proxy_set_header Host $host;
    }

    # PNG 확장자가 정적 파일 location으로 빠지지 않도록 공개 공유 카드 경로를 먼저 프록시한다.
    location ^~ /api/v1/public/announcement-images/ {
        set $api_host toadyWebApi:8080;
        proxy_pass http://$api_host;
        proxy_set_header Host $host;
    }

    location = /announcement-sitemap.xml {
        set $api_host toadyWebApi:8080;
        proxy_pass http://$api_host/api/v1/public/sitemap.xml;
    }
    location ~ ^/sitemaps/(apt|urban|remaining|public-rental|optional)/[0-9]+\.xml$ {
        set $api_host toadyWebApi:8080;
        rewrite ^/sitemaps/(.*)$ /api/v1/public/sitemaps/$1 break;
        proxy_pass http://$api_host;
    }

    location = /sitemaps/areas.xml {
        set $api_host toadyWebApi:8080;
        proxy_pass http://$api_host/api/v1/public/sitemaps/areas.xml;
    }

    # 생활권 공개 페이지: 검색어(예: 운정 청약)로 들어오는 사용자와 봇에게 서버 HTML 제공.
    location ~ ^/areas(/[a-z0-9-]+)?/?$ {
        set $api_host toadyWebApi:8080;
        rewrite ^/areas/?$ /api/v1/public/areas break;
        rewrite ^/areas/([a-z0-9-]+)/?$ /api/v1/public/areas/$1 break;
        proxy_pass http://$api_host;
        proxy_set_header Host $host;
    }

    # 회원별 캘린더 구독 주소. 캘린더 앱이 주기적으로 가져가며 정적 파일로 처리되지 않게 먼저 프록시한다.
    location ~ ^/calendar/([A-Za-z0-9_-]{43})\.ics$ {
        set $api_host toadyWebApi:8080;
        rewrite ^/calendar/(.*)$ /api/v1/public/calendar/$1 break;
        proxy_pass http://$api_host;
        proxy_set_header Host $host;
    }

    # [1] React SPA 라우팅 (새로고침 시 404 방지)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # [2] 정적 에셋(JS, CSS, 폰트, 이미지) 캐싱 설정 
    location ~* \.(?:css|js|woff2?|ttf|otf|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # [3] Gzip 압축 설정 (성능 최적화)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";
}
