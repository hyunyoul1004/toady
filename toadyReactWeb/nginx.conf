server {
    listen 80;
    server_name localhost;

    # React 빌드 정적 파일 서빙 디렉터리
    root /usr/share/nginx/html;
    index index.html;

    # [1] 신규 분양공고 API 리버스 프록시 (/api/) -> toadyWebApi 컨테이너 (8080)
    location /api/ {
        proxy_pass http://toadyWebApi:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # [2] 레거시 웹 API 리버스 프록시 (/webApi/) -> toadyWebApi 컨테이너 (8080)
    location /webApi/ {
        proxy_pass http://toadyWebApi:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # [3] React SPA 라우팅 (새로고침 시 404 방지)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # [4] 정적 에셋(JS, CSS, 폰트, 이미지) 캐싱 설정
    location ~* \.(?:css|js|woff2?|ttf|otf|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # [5] Gzip 압축 설정 (성능 최적화)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";
}
