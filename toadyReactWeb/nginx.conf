server {
    listen 80;
    server_name localhost;

    # React 빌드 정적 파일 서빙 디렉터리
    root /usr/share/nginx/html;
    index index.html;

    # 공고별 서버 HTML: JS를 실행하지 않는 검색·공유 봇에도 핵심 정보 제공.
    # 서비스 DNS는 요청 시 해석해 API 컨테이너 교체 후에도 기존 IP에 묶이지 않는다.
    resolver 127.0.0.11 valid=10s;
    location ~ ^/announcements/(apt|urban|remaining|public-rental|optional)/([a-zA-Z0-9_-]+)/([a-zA-Z0-9_-]+)$ {
        set $api_host toadyWebApi:8080;
        rewrite ^/announcements/(.*)$ /api/v1/public/announcements/$1 break;
        proxy_pass http://$api_host;
        proxy_set_header Host $host;
    }

    # PNG 확장자가 정적 파일 location으로 빠지지 않도록 공개 공유 카드 경로를 먼저 프록시한다.
    location ^~ /api/v1/public/announcement-images/ {
        set $api_host toadyWebApi:8080;
        proxy_pass http://$api_host;
        proxy_set_header Host $host;
    }

    location = /announcement-sitemap.xml {
        set $api_host toadyWebApi:8080;
        proxy_pass http://$api_host/api/v1/public/sitemap.xml;
    }
    location ~ ^/sitemaps/(apt|urban|remaining|public-rental|optional)/[0-9]+\.xml$ {
        set $api_host toadyWebApi:8080;
        rewrite ^/sitemaps/(.*)$ /api/v1/public/sitemaps/$1 break;
        proxy_pass http://$api_host;
    }

    location = /sitemaps/areas.xml {
        set $api_host toadyWebApi:8080;
        proxy_pass http://$api_host/api/v1/public/sitemaps/areas.xml;
    }

    # 생활권 공개 페이지: 검색어(예: 운정 청약)로 들어오는 사용자와 봇에게 서버 HTML 제공.
    location ~ ^/areas(/[a-z0-9-]+)?/?$ {
        set $api_host toadyWebApi:8080;
        rewrite ^/areas/?$ /api/v1/public/areas break;
        rewrite ^/areas/([a-z0-9-]+)/?$ /api/v1/public/areas/$1 break;
        proxy_pass http://$api_host;
        proxy_set_header Host $host;
    }

    # 무순위·줍줍, 이번 주 청약 공개 모음 페이지(서버 HTML).
    location ~ ^/(zupzup|weekly)/?$ {
        set $api_host toadyWebApi:8080;
        rewrite ^/(zupzup|weekly)/?$ /api/v1/public/$1 break;
        proxy_pass http://$api_host;
        proxy_set_header Host $host;
    }

    # 생활권 공개 캘린더(로그인 없이 구독).
    location ~ ^/calendar/areas/([a-z0-9-]+)\.ics$ {
        set $api_host toadyWebApi:8080;
        rewrite ^/calendar/areas/([a-z0-9-]+)\.ics$ /api/v1/public/areas/$1/calendar.ics break;
        proxy_pass http://$api_host;
        proxy_set_header Host $host;
    }

    # 회원별 캘린더 구독 주소. 캘린더 앱이 주기적으로 가져가며 정적 파일로 처리되지 않게 먼저 프록시한다.
    # 정규식에 {43}처럼 중괄호가 들어가면 nginx가 블록 시작으로 읽으므로 반드시 따옴표로 감싼다.
    location ~ "^/calendar/([A-Za-z0-9_-]{43})\.ics$" {
        set $api_host toadyWebApi:8080;
        rewrite ^/calendar/(.*)$ /api/v1/public/calendar/$1 break;
        proxy_pass http://$api_host;
        proxy_set_header Host $host;
    }

    # 웹 푸시 서비스 워커와 앱 매니페스트는 배포 즉시 갱신되도록 장기 캐시하지 않는다(정규식 정적 캐시보다 우선).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files /sw.js =404;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files /manifest.webmanifest =404;
    }

    # 보안 헤더(X-Frame-Options, HSTS 등)는 앞단 nginx가 붙인다. 여기서 다시 붙이면 같은 헤더가 두 번 나가
    # 일부 브라우저가 X-Frame-Options를 무효로 처리할 수 있으므로 이 파일에는 추가하지 않는다.

    # [1] index.html은 배포 직후 새 해시 에셋을 가리켜야 하므로 매번 재검증한다.
    #     SPA 경로의 try_files 마지막 인자(/index.html)는 내부 이동이라 이 location의 헤더가 함께 적용된다.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # [2] React SPA 라우팅 (새로고침 시 404 방지). public/의 기타 파일(robots.txt 등)은 1시간만 캐시한다.
    location / {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ /index.html;
    }

    # [3] Vite가 내용 해시를 붙여 만든 빌드 산출물만 1년 불변 캐시한다. 없는 파일은 index.html 대신 404로 응답해
    #     HTML이 JS 이름으로 장기 캐시되는 일을 막는다. ^~ 로 아래 정규식 location보다 우선한다.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # [4] 해시가 없는 정적 파일(public/의 아이콘·파비콘·이미지 등)은 이름이 그대로 바뀌므로 1시간만 캐시한다.
    location ~* \.(?:css|js|woff2?|ttf|otf|png|jpg|jpeg|gif|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # [5] Gzip 압축 설정 (성능 최적화)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";
}
