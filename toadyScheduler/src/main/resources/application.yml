spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true

logging:
  level:
    com.toady.web: INFO

server:
  port: ${SERVER_PORT:8082}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SCHEDULER_ADMIN_SECURE_COOKIE:false}

data:
  retention:
    # 방문·행동 로그와 발송 이력의 보관 기간 정리(한국시간). "-"이면 끈다. 스케줄러 계정에 DELETE 권한이 필요하다(database.sql 14번).
    cron: "${DATA_RETENTION_CRON:0 40 4 * * *}"

applyhome:
  admin:
    # 테이블·관리자 계정을 준비하기 전에는 기존 정적 스케줄만 실행하도록 기본 비활성화한다.
    enabled: ${SCHEDULER_ADMIN_ENABLED:false}
    username: ${SCHEDULER_ADMIN_USERNAME:admin}
    password: ${SCHEDULER_ADMIN_PASSWORD:}
  api:
    base-url: https://api.odcloud.kr/api/ApplyhomeInfoDetailSvc/v1
    service-key: ${APPLYHOME_API_KEY:}
    per-page: 1000
  competition:
    api:
      base-url: https://api.odcloud.kr/api/ApplyhomeInfoCmpetRtSvc/v1
      per-page: 1000
    scheduler:
      cron: "${APPLYHOME_COMPETITION_CRON:0 15 4,20 * * *}"
  scheduler:
    cron: "${APPLYHOME_SYNC_CRON:0 15 3 * * *}"
    lookback-days: ${APPLYHOME_LOOKBACK_DAYS:90}
