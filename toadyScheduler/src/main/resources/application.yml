# 청약홈 수집기(toadyScheduler) 설정. ${이름:기본값}은 환경변수(또는 .env.local)를 읽고, 없으면 콜론 뒤 값을 쓴다.
spring:
  # 접속 정보는 환경변수로만 받는다. 스케줄러 DB 계정은 toady_sources.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 테이블은 database.sql로만 바꾼다. JPA가 스키마를 만들거나 고치지 않게 한다.
      ddl-auto: none
      naming:
        # @Table·@Column에 적은 이름(TB_..., HOUSE_MANAGE_NO)을 바꾸지 않고 그대로 쓴다.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    # 웹 요청이 끝날 때까지 DB 연결을 붙잡지 않는다(화면이 없는 서버라 필요 없다).
    open-in-view: false
    properties:
      hibernate:
        # 엔티티 저장 시 INSERT를 500개씩 묶어 보내고, 같은 테이블끼리 정렬해 묶음 효율을 높인다.
        jdbc:
          batch_size: 500
        order_inserts: true

logging:
  level:
    com.toady.web: INFO

server:
  port: ${SERVER_PORT:8082}

data:
  retention:
    # 방문·행동 로그와 발송 이력의 보관 기간 정리(한국시간). "-"이면 끈다. 스케줄러 계정에 DELETE 권한이 필요하다(database.sql 14번).
    cron: "${DATA_RETENTION_CRON:0 40 4 * * *}"

applyhome:
  admin:
    # 관리 테이블(database.sql)을 준비하기 전에는 기존 정적 스케줄만 실행하도록 기본 비활성화한다.
    # 켜면 DB 기반 실행 이력·자동 일정과 관리자 사이트(toadyAdmin)용 내부 API(/internal/admin)를 사용한다.
    enabled: ${SCHEDULER_ADMIN_ENABLED:false}
    # 관리자 사이트(toadyAdmin)가 수집 실행·일정 변경을 요청할 때 쓰는 공유 토큰(32자 이상). 비우면 내부 API를 쓰지 않는다.
    internal-token: ${SCHEDULER_INTERNAL_TOKEN:}
  # 청약홈 분양정보 상세 API(공고·주택형). 인증키는 APPLYHOME_API_KEY로만 받고 저장소에 두지 않는다.
  api:
    base-url: https://api.odcloud.kr/api/ApplyhomeInfoDetailSvc/v1
    service-key: ${APPLYHOME_API_KEY:}
    per-page: 1000
  # 청약홈 경쟁률 API(경쟁률·특별공급 신청현황·가점). 인증키는 위와 같은 값을 쓴다.
  competition:
    api:
      base-url: https://api.odcloud.kr/api/ApplyhomeInfoCmpetRtSvc/v1
      per-page: 1000
    # 관리 기능이 꺼져 있을 때의 경쟁률 고정 일정(초 분 시 일 월 요일). 켜져 있으면 DB 일정의 최초 기본값으로만 쓴다.
    scheduler:
      cron: "${APPLYHOME_COMPETITION_CRON:0 15 4,20 * * *}"
  # 공고·주택형 고정 일정과 재조회 기간(오늘 기준 며칠 전 모집공고일까지). 위와 같은 규칙.
  scheduler:
    cron: "${APPLYHOME_SYNC_CRON:0 15 3 * * *}"
    lookback-days: ${APPLYHOME_LOOKBACK_DAYS:90}
