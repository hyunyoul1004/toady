# TOADY 웹 API 기본 설정. ${이름:기본값}은 환경변수(또는 .env) 값을 쓰고, 없으면 콜론 뒤 기본값을 쓴다는 뜻이다.
# 콜론 뒤가 비어 있으면 빈 문자열, 콜론이 없으면(${DB_URL}) 값이 꼭 있어야 하며 없으면 앱이 뜨지 않는다.
# 로컬 전용 값은 application-local.yml에서 덮어쓴다.
spring:
  # 시세 미리 계산·저녁 알림·정리 작업이 서로 기다리지 않도록 예약 작업 스레드를 둘 이상 둔다.
  task:
    scheduling:
      pool:
        size: 3
  config:
    # 실행 폴더의 .env 파일을 properties 형식으로 읽어 환경변수처럼 쓴다. optional이라 파일이 없어도 된다
    import: optional:file:.env[.properties]
  # MariaDB 연결. 커넥션 풀은 HikariCP(스프링 부트 기본)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 메일 발송 트랜잭션은 예산 확인용 커넥션을 하나 더 쓴다. 동시 요청이 몰려도 전체 API가 커넥션을 기다리며 멈추지 않게 여유를 두고, 대기는 짧게 끊는다.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    # 요청이 끝날 때까지 DB 연결을 붙잡지 않는다. 지연 로딩은 서비스(@Transactional) 안에서만 된다
    open-in-view: false
    properties:
      hibernate:
        # 운영 로그를 한 줄로 유지한다(로컬은 application-local.yml에서 보기 좋게 줄바꿈).
        format_sql: false
    hibernate:
      # 엔티티로 테이블을 만들거나 바꾸지 않는다. 스키마 변경은 저장소 루트 database.sql로 직접 적용한다
      ddl-auto: none
      naming:
        # 필드 이름(userEmail)을 컬럼 이름(USER_EMAIL)으로 바꾸는 규칙
        physical-strategy: com.toady.web.config.PhysicalNamingStrategyImpl
  # 메일 발송(JavaMailSender) SMTP 설정. 운영은 Gmail 계정 하나를 쓴다
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # SMTP 지연 시 DB 트랜잭션과 계정 잠금을 오래 점유하지 않도록 제한한다. (밀리초)
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
          auth: true
          starttls:
            enable: true
            required: true

server:
  # 운영 8080. 로컬은 application-local.yml이 8081로 바꾼다(화면 개발 서버가 /api를 8081로 넘긴다)
  port: ${SERVER_PORT:8080}
  # 지도용 단지 시세처럼 큰 JSON 응답을 압축한다(앞단 프록시 설정과 무관하게 전송량을 줄인다).
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2048

# 여기부터는 이 프로젝트 전용 설정. 코드에서 @Value("${toady....}")로 읽는다.
toady:
  # 요청 제한·로그인 실패 기록·외부 API 결과 캐시를 재시작 뒤에도 유지하고 API 여러 대가 함께 쓰게 하는 Redis.
  # 호스트가 비어 있으면(로컬·테스트) 연결하지 않고 메모리로 동작한다. 운영은 compose가 REDIS_HOST=redis를 넣는다.
  redis:
    host: ${REDIS_HOST:}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  # 새 공고 주소를 IndexNow로 검색엔진에 알린다. 키는 공개 값이며 웹 앱 public/{key}.txt와 같아야 한다.
  # 기본은 꺼짐. 운영 compose가 INDEXNOW_ENABLED=true를 넣고, 그때도 운영 주소일 때만 보낸다.
  indexnow:
    key: ${INDEXNOW_KEY:8ec7088feb88a7a3bb1a59bb4c34ebaf}
    enabled: ${INDEXNOW_ENABLED:false}
  mail:
    # 보내는 사람 주소·이름. 비우면 SMTP 로그인 계정이 보낸 사람이 된다(Gmail).
    # 발송 서비스(Amazon SES 등)로 옮길 때: MAIL_HOST·MAIL_USERNAME·MAIL_PASSWORD를 그 서비스 값으로, MAIL_FROM을 확인된 주소로,
    # GMAIL_ROLLING_LIMIT을 그 서비스 한도에 맞게 바꾼다. 코드는 그대로 쓴다.
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:TOADY}
  research:
    molit-service-key: ${MOLIT_TRADE_SERVICE_KEY:}
    # 카카오 로컬 REST API 키(서버 전용). 있으면 매일 접수 중·예정 공고의 주변 시세 비교를 미리 계산한다.
    kakao-rest-key: ${KAKAO_REST_API_KEY:}
    # 국토부 실거래 API 하루 호출 상한(서버 전체). 사용자 조회는 이 값의 80%까지, 나머지는 저녁 미리 계산 몫.
    # 공공데이터포털에서 받은 이 API의 일일 트래픽 한도보다 조금 낮게 둔다(개발계정 1만 회 → 9000). 0이면 세지 않는다.
    molit-daily-limit: ${MOLIT_DAILY_LIMIT:9000}
    # 미리 계산 시각(한국시간). 저녁 묶음 알림(18시) 전에 끝나도록 둔다. '-'이면 끈다.
    gap-cron: ${PRICE_GAP_CRON:0 20 17 * * *}
  planner:
    # 테이블 적용과 기존 Gmail 설정 확인 후 활성화한다. 외부 메일 업체를 사용하지 않는다.
    reminders-enabled: ${PLANNER_REMINDERS_ENABLED:false}
    mail-limit: ${GMAIL_ROLLING_LIMIT:400}
    auth-reserve: ${GMAIL_AUTH_RESERVE:100}
    # 회원가입 인증 메일의 24시간 상한. 0이면 mail-limit의 절반. 무작위 가입 반복이 비밀번호 찾기 메일까지 막지 않게 한다.
    signup-limit: ${GMAIL_SIGNUP_LIMIT:0}
  push:
    # VAPID 키는 환경변수로만 받는다. 둘 중 하나라도 없으면 알림 켜기 화면이 숨겨진다.
    vapid-public-key: ${WEB_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${WEB_PUSH_VAPID_PRIVATE_KEY:}
    subject: ${WEB_PUSH_SUBJECT:}
    # 하루 1회 묶음 발송(18~20시). database.sql 13번 적용 후 활성화한다.
    digest-enabled: ${PUSH_DIGEST_ENABLED:false}
  dm:
    # 쪽지 새 대화 시작 조건. 지금은 이용자를 늘리는 시기라 끄고(0·false) 시작한다.
    # 악용이 보이면 서버 .env.prod에서 켜고 재시작한다(예: 24시간, 이야기 1개 이상).
    min-account-hours: ${DM_MIN_ACCOUNT_HOURS:0}
    require-story: ${DM_REQUIRE_STORY:false}
    # 하루 한도: 새로 시작할 수 있는 대화 상대 수와 보낼 수 있는 쪽지 수
    daily-new-threads: ${DM_DAILY_NEW_THREADS:5}
    daily-messages: ${DM_DAILY_MESSAGES:50}
  analytics:
    # false면 페이지 조회·행동 이벤트를 받기만 하고 저장하지 않는다
    enabled: ${ANALYTICS_ENABLED:true}
  security:
    # JWT 서명 키(Base64, 64바이트 이상). 기본값이 없어 반드시 넣어야 한다. 값을 로그나 저장소에 남기지 않는다
    secret-key: ${JWT_SECRET}
    authorities-key: auth
    token-created-at-key: tca
    # 토큰 하나의 유효 시간(기본 90분). 만료 30분 전부터 응답 헤더로 새 토큰을 준다
    token-expire-ms: ${JWT_TOKEN_EXPIRE_MS:5400000}
  web:
    # 메일 링크·알림에 넣는 서비스 주소
    domain: ${TOADY_WEB_DOMAIN:https://www.toady.co.kr}
    # CORS 허용 Origin(쉼표 구분). SecurityConfig가 읽는다
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  admin:
    # 관리자 사이트가 부르는 내부 API(/internal/admin) 토큰. 관리자의 ADMIN_API_TOKEN과 같아야 하며 32자 이상. 비우면 기능을 끈다.
    internal-token: ${ADMIN_API_TOKEN:}
  sitemap:
    # 사이트맵에 넣을 공고: 접수 마감(없으면 모집공고일)이 이 일수 이내이거나 앞으로인 공고. 지난 공고 페이지는 그대로 열려 있다.
    recent-days: ${SITEMAP_RECENT_DAYS:365}

# 로그 파일 위치와 레벨. logback 설정 파일이 이 값을 읽는다
config:
  logging:
    path: ${LOG_PATH:./logs}
    name: toadyWebLog
    level:
      root: ${LOG_LEVEL_ROOT:INFO}
      src: ${LOG_LEVEL_SRC:INFO}
      jdbc-bind: ${LOG_LEVEL_JDBC_BIND:OFF}
      # 운영 기본은 SQL 로그를 남기지 않는다(요청마다 여러 SQL이 기록되어 로그가 하루 수십 MB씩 쌓인다). 필요하면 환경변수로 켠다.
      hibernate-sql: ${LOG_LEVEL_HIBERNATE_SQL:OFF}
