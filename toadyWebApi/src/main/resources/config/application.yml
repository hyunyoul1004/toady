spring:
  # 시세 미리 계산·저녁 알림·정리 작업이 서로 기다리지 않도록 예약 작업 스레드를 둘 이상 둔다.
  task:
    scheduling:
      pool:
        size: 3
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 메일 발송 트랜잭션은 예산 확인용 커넥션을 하나 더 쓴다. 동시 요청이 몰려도 전체 API가 커넥션을 기다리며 멈추지 않게 여유를 두고, 대기는 짧게 끊는다.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # 운영 로그를 한 줄로 유지한다(로컬은 application-local.yml에서 보기 좋게 줄바꿈).
        format_sql: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: com.toady.web.config.PhysicalNamingStrategyImpl
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # SMTP 지연 시 DB 트랜잭션과 계정 잠금을 오래 점유하지 않도록 제한한다. (밀리초)
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
          auth: true
          starttls:
            enable: true
            required: true

decorator:
  datasource:
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  # 지도용 단지 시세처럼 큰 JSON 응답을 압축한다(앞단 프록시 설정과 무관하게 전송량을 줄인다).
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2048

toady:
  research:
    molit-service-key: ${MOLIT_TRADE_SERVICE_KEY:}
    # 카카오 로컬 REST API 키(서버 전용). 있으면 매일 접수 중·예정 공고의 주변 시세 비교를 미리 계산한다.
    kakao-rest-key: ${KAKAO_REST_API_KEY:}
    # 미리 계산 시각(한국시간). 저녁 묶음 알림(18시) 전에 끝나도록 둔다. '-'이면 끈다.
    gap-cron: ${PRICE_GAP_CRON:0 20 17 * * *}
  planner:
    # 테이블 적용과 기존 Gmail 설정 확인 후 활성화한다. 외부 메일 업체를 사용하지 않는다.
    reminders-enabled: ${PLANNER_REMINDERS_ENABLED:false}
    mail-limit: ${GMAIL_ROLLING_LIMIT:400}
    auth-reserve: ${GMAIL_AUTH_RESERVE:100}
  push:
    # VAPID 키는 환경변수로만 받는다. 둘 중 하나라도 없으면 알림 켜기 화면이 숨겨진다.
    vapid-public-key: ${WEB_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${WEB_PUSH_VAPID_PRIVATE_KEY:}
    subject: ${WEB_PUSH_SUBJECT:}
    # 하루 1회 묶음 발송(18~20시). database.sql 13번 적용 후 활성화한다.
    digest-enabled: ${PUSH_DIGEST_ENABLED:false}
  analytics:
    enabled: ${ANALYTICS_ENABLED:true}
  security:
    secret-key: ${JWT_SECRET}
    authorities-key: auth
    token-created-at-key: tca
    token-expire-ms: ${JWT_TOKEN_EXPIRE_MS:5400000}
  web:
    domain: ${TOADY_WEB_DOMAIN:https://www.toady.co.kr}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

config:
  logging:
    path: ${LOG_PATH:./logs}
    name: toadyWebLog
    pattern: log
    level:
      root: ${LOG_LEVEL_ROOT:INFO}
      src: ${LOG_LEVEL_SRC:INFO}
      jdbc: ${LOG_LEVEL_JDBC:OFF}
      jdbc-bind: ${LOG_LEVEL_JDBC_BIND:OFF}
      p6spy: ${LOG_LEVEL_P6SPY:OFF}
      # 운영 기본은 SQL 로그를 남기지 않는다(요청마다 여러 SQL이 기록되어 로그가 하루 수십 MB씩 쌓인다). 필요하면 환경변수로 켠다.
      hibernate-sql: ${LOG_LEVEL_HIBERNATE_SQL:OFF}
